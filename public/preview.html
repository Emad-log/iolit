<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iolit preview</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Fraunces;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/fraunces-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: #ffffff;
      color: hsl(30 22% 12%);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas#world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: hsl(30 10% 50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid hsl(38 22% 86%);
      border-radius: 999px;
      padding: 6px 12px;
      z-index: 3;
      white-space: nowrap;
    }
    .banner a { color: hsl(262 70% 45%); text-decoration: none; }
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px calc(88px + clamp(300px, 38vh, 400px) + 20px);
      pointer-events: none;
    }
    .copy {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 10px;
    }
    .accent {
      color: hsl(262 70% 38%);
      font-style: italic;
      padding-right: 0.3em;
    }
    .sub {
      font-size: 15px;
      line-height: 1.55;
      color: hsl(30 10% 36%);
      text-align: center;
      max-width: 340px;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
    }
    input[type="email"] {
      flex: 1;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid hsl(38 22% 82%);
      background: #ffffff;
      font-size: 14px;
      color: hsl(30 22% 12%);
      outline: none;
    }
    input[type="email"]:focus {
      border-color: hsl(262 70% 45%);
      box-shadow: 0 0 0 3px hsl(262 70% 45% / 0.15);
    }
    .btn {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #faf7f0;
      background: hsl(262 70% 45%);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .ok { display: none; font-size: 15px; font-weight: 500; }
    .ok.show { display: block; }
    .err { display: none; font-size: 12px; color: hsl(0 70% 45%); margin-top: 10px; }
    .err.show { display: block; }
    .term {
      margin-top: 20px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      background: hsl(30 22% 10%);
      color: hsl(38 30% 90%);
      padding: 13px 18px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      cursor: pointer;
      box-shadow: 0 10px 24px -12px rgba(30, 15, 5, 0.35);
    }
    .term .dollar { color: hsl(262 40% 70%); }
    .term .hint {
      margin-left: 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
    }
    .tiers {
      margin-top: 12px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: hsl(30 10% 44%);
    }
    .pad {
      display: none;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: none) {
      .pad { display: flex; }
    }
    .pad button {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 15px;
      width: 58px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid hsl(38 22% 82%);
      background: #ffffff;
      color: hsl(30 22% 20%);
      cursor: pointer;
      touch-action: manipulation;
    }
    .pad button:active { background: hsl(262 70% 45%); color: #faf7f0; }
    footer {
      margin-top: 18px;
      display: flex;
      gap: 18px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
    }
    footer a { color: hsl(30 10% 44%); text-decoration: none; }
    footer a:hover { color: hsl(262 70% 45%); }
  </style>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="banner">preview · <a href="/">live site</a></div>
  <main>
    <div class="copy">
      <h1>Your AI subscription<br>should <span class="accent">pay you back.</span></h1>
      <p class="sub">A silent agent for Claude, Cursor, and Codex. More you share, more you get paid.</p>
      <form id="form">
        <input type="email" required placeholder="you@example.com" id="email" />
        <button class="btn" type="submit">Join waitlist</button>
      </form>
      <div class="ok" id="ok">You're on the list. We'll email once.</div>
      <p class="err" id="err">Something went wrong. Try again.</p>
      <button class="term" id="copy" type="button">
        <span class="dollar">$</span>
        <span>curl -fsSL iolit.dev/install | sh</span>
        <span class="hint" id="copied">copy</span>
      </button>
      <p class="tiers">pulse · trace · raw</p>
      <div class="pad">
        <button id="b-l" aria-label="left">◀</button>
        <button id="b-j" aria-label="up">▲</button>
        <button id="b-m" aria-label="mine">⛏</button>
        <button id="b-r" aria-label="right">▶</button>
      </div>
      <footer>
        <a href="/">live</a>
        <a href="/privacy">privacy</a>
        <a href="/terms">terms</a>
        <a href="https://github.com/Emad-log/iolit-client">source</a>
      </footer>
    </div>
  </main>
  <script>
    const INSTALL = "curl -fsSL iolit.dev/install | sh";
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(INSTALL); } catch {}
      const hint = document.getElementById("copied");
      hint.textContent = "copied";
      setTimeout(() => { hint.textContent = "copy"; }, 1600);
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.classList.remove("show");
      try {
        const res = await fetch("/api/waitlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value, source: "preview" }),
        });
        if (!res.ok) throw new Error("bad");
        document.getElementById("form").style.display = "none";
        document.getElementById("ok").classList.add("show");
      } catch {
        err.classList.add("show");
      }
    });

    // Boulder Dash style cave, reskinned for iolit.
    const T = 16;
    const S = 2.5;
    const O = { SPACE: 0, DIRT: 1, BRICK: 2, STEEL: 3, FORGE: 4 };
    const TIERS = {
      pulse: { color: "#c4b5fd", mid: "#a78bfa", dark: "#6d28d9", hi: "#ffffff", coins: 1 },
      trace: { color: "#a78bfa", mid: "#8b5cf6", dark: "#5b21b6", hi: "#ffffff", coins: 4 },
      raw: { color: "#7c3aed", mid: "#5b21b6", dark: "#3b0a63", hi: "#ffffff", coins: 12 },
    };
    const DIRT_A = "#e7e1d3", DIRT_B = "#ddd5c4", DIRT_HI = "#f5f1e6", DIRT_LO = "#c4b99f";
    const BRICK_A = "#cfc7b7", BRICK_HI = "#e3ddcf", BRICK_LO = "#a89e8a", BRICK_LINE = "#8d8371";

    const cv = document.getElementById("world");
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;

    let W = 0, H = 0;
    let grid = new Uint8Array(0);
    let gems = [];
    let particles = [];
    let floats = [];
    let dust = [];
    let smoke = [];
    let clouds = [];
    let coins = 0, gemsMined = 0;
    let frame = 0;
    let forge = { tx: 0, ty: 0 };
    let shake = 0;
    let lastGemTick = 0;

    const miner = {
      tx: 1, ty: 1,
      fx: 0, fy: 0,
      face: 1,
      walk: 0,
      moving: false,
      mineAnim: 0,
      carry: [],
    };
    let inputDir = 0;
    let path = [];
    let lastInput = -1e9;
    let pathTimer = 0;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const now = () => performance.now();

    function at(tx, ty) {
      if (tx < 0 || tx >= W || ty < 0 || ty >= H) return O.STEEL;
      return grid[ty * W + tx];
    }
    function setAt(tx, ty, v) {
      if (tx >= 0 && tx < W && ty >= 0 && ty < H) grid[ty * W + tx] = v;
    }

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth / S;
      const h = window.innerHeight / S;
      cv.width = Math.floor(window.innerWidth * dpr);
      cv.height = Math.floor(window.innerHeight * dpr);
      g.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);

      const rows = 9;
      W = Math.max(26, Math.ceil(w / T) + 1);
      H = rows;
      grid = new Uint8Array(W * H);

      for (let tx = 0; tx < W; tx++) {
        setAt(tx, 0, O.STEEL);
        setAt(tx, H - 2, O.STEEL);
        setAt(tx, H - 1, O.STEEL);
      }
      for (let ty = 0; ty < H; ty++) {
        setAt(0, ty, O.STEEL);
        setAt(W - 1, ty, O.STEEL);
      }

      for (let ty = 1; ty < H - 2; ty++) {
        for (let tx = 1; tx < W - 1; tx++) setAt(tx, ty, O.DIRT);
      }
      const pillars = [[0.22, 3], [0.4, 2], [0.58, 3], [0.75, 2]];
      for (const [fx, len] of pillars) {
        const tx = Math.floor(W * fx);
        for (let i = 0; i < len; i++) {
          if (tx + i < W - 4) setAt(tx + i, 3, O.BRICK);
        }
      }

      forge = { tx: W - 3, ty: 3 };
      setAt(forge.tx, forge.ty, O.FORGE);
      setAt(forge.tx, forge.ty + 1, O.STEEL);
      setAt(forge.tx, forge.ty - 1, O.STEEL);
      setAt(W - 2, forge.ty, O.STEEL);

      gems = [];
      const spots = [[0.12, 2, "pulse"], [0.2, 4, "trace"], [0.3, 2, "trace"], [0.44, 5, "raw"], [0.52, 2, "pulse"], [0.64, 4, "trace"], [0.72, 5, "raw"], [0.81, 3, "pulse"]];
      for (const [fx, fy, tier] of spots) {
        const tx = Math.floor(W * fx);
        if (tx > 0 && tx < W - 1) spawnGem(tx, fy, tier);
      }

      miner.tx = 2;
      miner.ty = 2;
      miner.fx = miner.tx * T;
      miner.fy = miner.ty * T;
      miner.carry = [];
      miner.moving = false;
      particles = [];
      floats = [];
      smoke = [];
      path = [];

      dust = [];
      for (let i = 0; i < 18; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * ((H - 2) * T - 30),
          vx: -0.06 - Math.random() * 0.1,
          vy: 0.03 + Math.random() * 0.05,
          s: Math.random() > 0.6 ? 2 : 1,
        });
      }
      clouds = [
        { x: w * 0.2, y: h * 0.14, s: 1.0, v: 0.05 },
        { x: w * 0.55, y: h * 0.09, s: 1.4, v: 0.07 },
        { x: w * 0.8, y: h * 0.18, s: 0.8, v: 0.04 },
      ];
    }

    function spawnGem(tx, ty, tier) {
      gems.push({ tx, ty, tier, state: "wall", spark: 40 + (Math.random() * 60 | 0) });
    }

    function touchUser() { lastInput = now(); }

    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];
    function setInput(dir) {
      inputDir = dir;
      touchUser();
    }
    window.addEventListener("keydown", (e) => {
      const map = { ArrowLeft: 3, ArrowRight: 1, ArrowUp: 0, ArrowDown: 2, " ": -1 };
      const k = e.key;
      if (k in map) {
        e.preventDefault();
        if (map[k] === -1) mineTap();
        else setInput(map[k]);
      }
    });
    function mineTap() {
      touchUser();
      if (miner.mineAnim > 0) return;
      const ftx = miner.tx + DX[dirFromFace(miner.face)];
      const fty = miner.ty + DY[dirFromFace(miner.face)];
      if (at(ftx, fty) === O.DIRT) {
        miner.mineAnim = 14;
        miner.face = dirFromFace(miner.face);
      }
    }
    function dirFromFace(f) { return f === -1 ? 3 : 1; }

    function hold(id, dir) {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (dir === "m") mineTap();
        else setInput(dir);
      });
    }
    hold("b-l", 3); hold("b-r", 1); hold("b-j", 0); hold("b-m", "m");

    function gemAtTile(tx, ty) {
      return gems.find((gm) => gm.state === "wall" && gm.tx === tx && gm.ty === ty);
    }

    function passable(tx, ty) {
      const v = at(tx, ty);
      return v === O.SPACE || v === O.DIRT || v === O.FORGE || !!gemAtTile(tx, ty);
    }

    function bfs(fromTx, fromTy, goalFn) {
      const key = (x, y) => y * W + x;
      const prev = new Int32Array(W * H).fill(-1);
      const seen = new Uint8Array(W * H);
      const queue = [key(fromTx, fromTy)];
      seen[key(fromTx, fromTy)] = 1;
      let head = 0;
      let goal = -1;
      while (head < queue.length && queue.length < W * H) {
        const cur = queue[head++];
        const cx = cur % W, cy = (cur / W) | 0;
        if (goalFn(cx, cy)) { goal = cur; break; }
        for (let d = 0; d < 4; d++) {
          const nx = cx + DX[d], ny = cy + DY[d];
          const nk = key(nx, ny);
          if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
          if (seen[nk]) continue;
          if (!passable(nx, ny)) continue;
          seen[nk] = 1;
          prev[nk] = cur;
          queue.push(nk);
        }
      }
      if (goal < 0) return null;
      const out = [];
      let cur = goal;
      while (cur !== -1 && cur !== key(fromTx, fromTy)) {
        out.push([cur % W, (cur / W) | 0]);
        cur = prev[cur];
      }
      out.reverse();
      return out;
    }

    function autopilot() {
      if (reduce) return;
      if (now() - lastInput < 4200) return;

      if (miner.carry.length >= 3 || (miner.carry.length > 0 && !gems.some((gm) => gm.state === "wall"))) {
        if (miner.tx === forge.tx - 1 && miner.ty === forge.ty) {
          deposit();
          return;
        }
        if (!path.length || pathTimer <= 0) {
          path = bfs(miner.tx, miner.ty, (x, y) => x === forge.tx - 1 && y === forge.ty) || [];
          pathTimer = 30;
        }
      } else {
        const live = gems.filter((gm) => gm.state === "wall");
        if (!live.length) return;
        let best = null, bd = 1e9;
        for (const gm of live) {
          const d = Math.abs(gm.tx - miner.tx) + Math.abs(gm.ty - miner.ty);
          if (d < bd) { bd = d; best = gm; }
        }
        if (!best) return;
        if (!path.length || pathTimer <= 0) {
          path = bfs(miner.tx, miner.ty, (x, y) => x === best.tx && y === best.ty) || [];
          pathTimer = 30;
        }
      }
      if (pathTimer > 0) pathTimer -= 1;
    }

    function stepMiner(dir) {
      const nx = miner.tx + DX[dir];
      const ny = miner.ty + DY[dir];
      const v = at(nx, ny);
      if (v === O.STEEL || v === O.BRICK) return false;
      if (v === O.DIRT || v === O.SPACE || v === O.FORGE || gemAtTile(nx, ny)) {
        if (v === O.DIRT) {
          setAt(nx, ny, O.SPACE);
          puff(nx * T + 8, ny * T + 8);
        }
        miner.tx = nx;
        miner.ty = ny;
        miner.moving = true;
        miner.walk = (miner.walk + 1) % 16;
        const gm = gemAtTile(nx, ny);
        if (gm && miner.carry.length < 3) {
          gm.state = "carried";
          miner.carry.push(gm.tier);
          gemsMined += 1;
          burst(nx * T + 8, ny * T + 8, TIERS[gm.tier]);
          shake = 4;
          setTimeout(() => {
            gm.state = "done";
            if (!gems.some((x) => x.state === "wall")) respawnAll();
          }, 500);
        }
        if (v === O.FORGE) deposit();
        return true;
      }
      return false;
    }

    function respawnAll() {
      const spots = [[0.12, 2, "pulse"], [0.2, 4, "trace"], [0.3, 2, "trace"], [0.44, 5, "raw"], [0.52, 2, "pulse"], [0.64, 4, "trace"], [0.72, 5, "raw"], [0.81, 3, "pulse"]];
      for (const [fx, fy, tier] of spots) {
        const tx = Math.floor(W * fx);
        if (tx > 0 && tx < W - 1 && !gems.some((gm) => gm.tx === tx && gm.ty === fy && gm.state !== "done")) {
          spawnGem(tx, fy, tier);
        }
      }
    }

    function deposit() {
      if (!miner.carry.length) return;
      let total = 0;
      for (const tier of miner.carry) total += TIERS[tier].coins;
      coins += total;
      miner.carry = [];
      const px = forge.tx * T + 8, py = forge.ty * T + 8;
      for (let i = 0; i < 6 + total; i++) {
        particles.push({
          x: px + (Math.random() - 0.5) * 14, y: py,
          vx: (Math.random() - 0.5) * 2.6,
          vy: -3 - Math.random() * 2.2,
          life: 32 + (Math.random() * 16 | 0),
          color: "#f5c542",
          gold: true,
          size: 4,
        });
      }
      floats.push({ x: px, y: py - 8, text: "+" + total, life: 46, color: "#e6a817" });
    }

    function puff(x, y) {
      for (let i = 0; i < 4; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 1.6,
          vy: -Math.random() * 1.4 - 0.3,
          life: 16 + (Math.random() * 8 | 0),
          color: i % 2 ? DIRT_HI : DIRT_LO,
          gold: false,
          size: 2,
        });
      }
    }
    function burst(x, y, tier) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 2.8,
          vy: -Math.random() * 3 - 0.6,
          life: 26 + (Math.random() * 14 | 0),
          color: i % 2 ? tier.hi : tier.mid,
          gold: false,
          size: 3,
        });
      }
    }

    function update() {
      if (miner.mineAnim > 0) {
        miner.mineAnim -= 1;
        if (miner.mineAnim === 8) {
          const d = dirFromFace(miner.face);
          const ftx = miner.tx + DX[d];
          const fty = miner.ty + DY[d];
          if (at(ftx, fty) === O.DIRT) {
            setAt(ftx, fty, O.SPACE);
            puff(ftx * T + 8, fty * T + 8);
            shake = 3;
            path = [];
          }
        }
      } else if (!miner.moving) {
        autopilot();
        let dir = inputDir;
        if (path.length) {
          const [px, py] = path[0];
          if (px === miner.tx && py === miner.ty) path.shift();
          if (path.length) {
            const [nx, ny] = path[0];
            if (nx > miner.tx) dir = 1;
            else if (nx < miner.tx) dir = 3;
            else if (ny > miner.ty) dir = 2;
            else if (ny < miner.ty) dir = 0;
          }
        }
        if (dir >= 0 && dir < 4) {
          if (dir === 1) miner.face = 1;
          if (dir === 3) miner.face = -1;
          if (!stepMiner(dir)) path = [];
        }
      } else {
        const txp = miner.tx * T;
        const typ = miner.ty * T;
        miner.fx += (txp - miner.fx) * 0.35;
        miner.fy += (typ - miner.fy) * 0.35;
        if (Math.abs(txp - miner.fx) < 1.5 && Math.abs(typ - miner.fy) < 1.5) {
          miner.fx = txp;
          miner.fy = typ;
          miner.moving = false;
        }
      }

      if (frame - lastGemTick > 6) {
        lastGemTick = frame;
        for (const gm of gems) {
          if (gm.state !== "wall") continue;
          if (at(gm.tx, gm.ty + 1) === O.SPACE) {
            gm.ty += 1;
            path = [];
          }
        }
      }
    }

    function px(x, y, w, h, color) {
      g.fillStyle = color;
      g.fillRect(Math.round(x), Math.round(y), w, h);
    }

    const PAL = {
      h: "#d9d2e2", H: "#b3aac4",
      y: "#ffd54a", Y: "#fff3c4",
      f: "#e8b98a", e: "#241a33",
      j: "#5b3f9e", J: "#4a2f85",
      B: "#2b1f4a", p: "#4a2f85",
      k: "#241a33", w: "#8a5a2b", m: "#cfd2dd",
    };
    const BODY = [
      ".....hhhhhh.....",
      "....hhhhhhhh....",
      "...hhhhyyyhhh...",
      "..hhhhhhhyyhh...",
      "hhhhhhhhhhhhhhh",
      ".....fffff......",
      "....fffffff.....",
      "....fffefef.....",
      "....fffffff.....",
      ".....fffff......",
      ".....jjjjjj.....",
      "....jjjjjjjj....",
      "....jJjjjjJj....",
      "....jjjjjjjj....",
      "....jBBBBBBj....",
      "....jjjjjjjj....",
      ".....pppppp.....",
      ".....pp..pp.....",
      ".....pp..pp.....",
      ".....kk..kk.....",
    ];
    const BODY_W1 = [
      ".....hhhhhh.....",
      "....hhhhhhhh....",
      "...hhhhyyyhhh...",
      "..hhhhhhhyyhh...",
      "hhhhhhhhhhhhhhh",
      ".....fffff......",
      "....fffffff.....",
      "....fffefef.....",
      "....fffffff.....",
      ".....fffff......",
      ".....jjjjjj.....",
      "....jjjjjjjj....",
      "....jJjjjjJj....",
      "....jjjjjjjj....",
      "....jBBBBBBj....",
      "....jjjjjjjj....",
      ".....pppppp.....",
      "....pp..pp......",
      "...pp....pp.....",
      "...kk....kk.....",
    ];
    const BODY_W2 = [
      ".....hhhhhh.....",
      "....hhhhhhhh....",
      "...hhhhyyyhhh...",
      "..hhhhhhhyyhh...",
      "hhhhhhhhhhhhhhh",
      ".....fffff......",
      "....fffffff.....",
      "....fffefef.....",
      "....fffffff.....",
      ".....fffff......",
      ".....jjjjjj.....",
      "....jjjjjjjj....",
      "....jJjjjjJj....",
      "....jjjjjjjj....",
      "....jBBBBBBj....",
      "....jjjjjjjj....",
      ".....pppppp.....",
      ".....pp..pp.....",
      "....pp....pp....",
      "....kk....kk.....",
    ];

    function drawBody(rows, x, y) {
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < row.length; c++) {
          const ch = row[c];
          if (ch === "." || ch === " ") continue;
          if (PAL[ch]) px(x + c, y + r, 1, 1, PAL[ch]);
        }
      }
    }

    function drawPick(phase, x, y) {
      if (phase === 0) {
        px(x + 10, y + 2, 2, 10, PAL.w);
        px(x + 6, y, 5, 2, PAL.m);
        px(x + 10, y - 1, 2, 2, PAL.m);
      } else if (phase === 1) {
        px(x + 12, y - 8, 2, 12, PAL.w);
        px(x + 9, y - 10, 5, 2, PAL.m);
      } else {
        px(x + 9, y + 7, 11, 2, PAL.w);
        px(x + 18, y + 3, 2, 7, PAL.m);
        px(x + 18, y + 2, 3, 2, "#ffffff");
      }
    }

    function drawMiner() {
      const idleBob = !miner.moving && miner.mineAnim === 0 ? Math.round(Math.sin(frame * 0.06)) : 0;
      const bob = miner.moving ? (miner.walk > 7 ? 1 : 0) : idleBob;
      const cx = miner.fx, cy = miner.fy - bob;

      const lamX = cx + (miner.face === 1 ? 11 : 4);
      const beam = g.createRadialGradient(lamX, cy + 12, 1, lamX, cy + 12, 26);
      beam.addColorStop(0, "rgba(255, 210, 100, 0.20)");
      beam.addColorStop(1, "rgba(255, 210, 100, 0)");
      g.fillStyle = beam;
      g.fillRect(lamX - 26, cy - 10, 52, 52);

      g.save();
      g.translate(Math.round(cx), Math.round(cy));
      if (miner.face === -1) g.scale(-1, 1);
      g.translate(-1, 0);
      const swing = miner.mineAnim > 0;
      const phase = swing ? Math.floor((14 - miner.mineAnim) / 5) : -1;
      if (swing) drawPick(phase, 0, 0);
      else px(0, 9, 1, 6, PAL.w);
      let rows = BODY;
      if (miner.moving) rows = miner.walk > 7 ? BODY_W2 : BODY_W1;
      drawBody(rows, 0, 0);
      g.restore();

      for (let i = 0; i < miner.carry.length; i++) {
        const tier = TIERS[miner.carry[i]];
        const gy = cy - 12 - i * 7;
        px(cx + 4, gy, 6, 2, tier.color);
        px(cx + 2, gy + 2, 10, 3, tier.mid);
        px(cx + 5, gy + 5, 4, 2, tier.dark);
        px(cx + 6, gy + 1, 2, 1, tier.hi);
      }
    }

    function drawGemTile(gm) {
      if (gm.state !== "wall") return;
      const x = gm.tx * T, y = gm.ty * T;
      const tier = TIERS[gm.tier];
      const tw = frame % 28 < 4;
      px(x + 3, y + 1, 10, 2, tier.color);
      px(x + 1, y + 3, 14, 3, tier.color);
      px(x + 3, y + 6, 10, 2, tier.mid);
      px(x + 2, y + 4, 3, 2, tier.hi);
      px(x + 9, y + 5, 2, 1, tier.dark);
      px(x + 6, y + 2, 2, 2, tw ? "#ffffff" : tier.hi);
    }

    function drawTile(tx, ty) {
      const v = at(tx, ty);
      const x = tx * T, y = ty * T;
      if (v === O.SPACE) return;
      if (v === O.DIRT) {
        px(x, y, T, T, ((tx * 7 + ty * 13) % 3 === 0) ? DIRT_B : DIRT_A);
        if ((tx * 3 + ty * 5) % 4 === 0) px(x + 5, y + 6, 2, 2, DIRT_HI);
        if ((tx * 5 + ty * 3) % 5 === 0) px(x + 10, y + 9, 2, 2, DIRT_LO);
        if ((tx * 11 + ty * 7) % 6 === 0) px(x + 2, y + 3, 1, 1, DIRT_LO);
        return;
      }
      if (v === O.BRICK) {
        px(x, y, T, T, BRICK_A);
        px(x, y, T, 2, BRICK_HI);
        px(x, y + T - 2, T, 2, BRICK_LO);
        px(x, y + 7, T, 2, BRICK_LINE);
        px(x + 7, y, 2, 7, BRICK_LINE);
        px(x + 7, y + 9, 2, 7, BRICK_LINE);
        return;
      }
      if (v === O.STEEL) {
        px(x, y, T, T, "#b9b0a0");
        px(x, y, T, 3, "#d5cdbd");
        px(x, y + T - 3, T, 3, "#948b7a");
        px(x, y + T - 1, T, 1, "#7d7567");
        if ((tx * 7 + ty * 13) % 4 === 0) px(x + 4, y + 8, 2, 2, "#a49a88");
        return;
      }
      if (v === O.FORGE) {
        px(x, y, T, T, "#8a5a2b");
        px(x, y, T, 3, "#a5713f");
        px(x, y + T - 2, T, 2, "#6d4520");
        const fire = Math.floor(frame / 6) % 3;
        px(x + 3, y - 3, 10, 3, "#6d28d9");
        px(x + 5, y - 3 - fire, 6, 2 + fire, "#a78bfa");
        px(x + 7, y - 4 - fire, 2, 2, "#ede9fe");
      }
    }

    function drawSky(w, h) {
      const sky = g.createLinearGradient(0, 0, 0, h * 0.7);
      sky.addColorStop(0, "#f6f2fb");
      sky.addColorStop(1, "#ffffff");
      g.fillStyle = sky;
      g.fillRect(0, 0, w, h);
      for (const c of clouds) {
        g.fillStyle = "rgba(214, 200, 240, 0.5)";
        g.beginPath();
        g.ellipse(c.x, c.y, 34 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.ellipse(c.x - 22 * c.s, c.y + 4 * c.s, 22 * c.s, 8 * c.s, 0, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.ellipse(c.x + 24 * c.s, c.y + 5 * c.s, 20 * c.s, 7 * c.s, 0, 0, Math.PI * 2);
        g.fill();
      }
      g.fillStyle = "rgba(216, 202, 242, 0.55)";
      g.beginPath();
      g.ellipse(w * 0.15, H * T + 30, w * 0.4, 26, 0, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "rgba(226, 214, 246, 0.6)";
      g.beginPath();
      g.ellipse(w * 0.7, H * T + 34, w * 0.35, 20, 0, 0, Math.PI * 2);
      g.fill();
    }

    function drawWorld() {
      const w = window.innerWidth / S, h = window.innerHeight / S;
      g.save();
      if (shake > 0) {
        g.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
        shake -= 1;
      }
      g.clearRect(-4, -4, w + 8, h + 8);
      drawSky(w, h);

      for (const d of dust) {
        g.fillStyle = "rgba(90, 78, 62, 0.10)";
        g.fillRect(Math.round(d.x), Math.round(d.y), d.s, d.s);
      }
      for (const s of smoke) {
        g.fillStyle = "rgba(120, 110, 100, " + Math.max(0, 0.22 - s.age * 0.012) + ")";
        g.fillRect(Math.round(s.x), Math.round(s.y), 3, 3);
      }

      for (let ty = 0; ty < H; ty++) {
        for (let tx = 0; tx < W; tx++) drawTile(tx, ty);
      }
      for (const gm of gems) drawGemTile(gm);

      for (const p of particles) {
        g.globalAlpha = Math.max(0, p.life / 34);
        if (p.gold) {
          px(p.x - 2, p.y - 2, 4, 4, p.color);
          px(p.x - 2, p.y - 2, 4, 1, "#fff3c4");
        } else {
          px(p.x, p.y, p.size, p.size, p.color);
        }
        g.globalAlpha = 1;
      }

      drawMiner();

      const live = gems.filter((gm) => gm.state === "wall");
      if (miner.carry.length >= 3 || !live.length) {
        if (miner.carry.length) {
          const bob = frame % 40 < 20 ? 0 : 3;
          g.fillStyle = "rgba(60, 50, 40, 0.55)";
          g.font = "8px ui-monospace, Menlo, monospace";
          g.textAlign = "center";
          g.fillText("▼", forge.tx * T + 8, forge.ty * T - 14 + bob);
          g.textAlign = "left";
        }
      } else {
        let best = null, bd = 1e9;
        for (const gm of live) {
          const d = Math.abs(gm.tx - miner.tx) + Math.abs(gm.ty - miner.ty);
          if (d < bd) { bd = d; best = gm; }
        }
        if (best) {
          const bob = frame % 40 < 20 ? 0 : 3;
          g.fillStyle = "rgba(60, 50, 40, 0.55)";
          g.font = "8px ui-monospace, Menlo, monospace";
          g.textAlign = "center";
          g.fillText("▼", best.tx * T + 8, best.ty * T - 10 + bob);
          g.textAlign = "left";
        }
      }

      for (const f of floats) {
        g.globalAlpha = Math.max(0, f.life / 46);
        g.fillStyle = f.color;
        g.font = "9px ui-monospace, Menlo, monospace";
        g.fillText(f.text, f.x, f.y);
        g.globalAlpha = 1;
      }
      g.restore();

      g.font = "9px ui-monospace, Menlo, monospace";
      g.textBaseline = "top";
      g.fillStyle = "rgba(60, 50, 40, 0.7)";
      g.fillText("gems " + gemsMined + " · coins " + coins, 12, 12);
      if (miner.carry.length) {
        g.fillStyle = "rgba(91, 63, 158, 0.8)";
        g.fillText("haul " + miner.carry.length + "/3", 12, 24);
      }
    }

    function loop() {
      update();
      drawWorld();
      frame += 1;
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= 1;
      }
      particles = particles.filter((p) => p.life > 0);
      for (const f of floats) { f.y -= 0.4; f.life -= 1; }
      floats = floats.filter((f) => f.life > 0);
      for (const d of dust) {
        d.x += d.vx;
        d.y += d.vy;
        if (d.x < -4) d.x = window.innerWidth / S + 4;
        if (d.y > (H - 2) * T - 8) d.y = 4;
      }
      for (const s of smoke) {
        s.y -= 0.35;
        s.age += 1;
      }
      smoke = smoke.filter((s) => s.age < 26);
      if (frame % 14 === 0) {
        smoke.push({ x: forge.tx * T + 8, y: forge.ty * T - 8, age: 0 });
      }
      for (const c of clouds) {
        c.x += c.v;
        if (c.x > window.innerWidth / S + 60) c.x = -60;
      }
      for (const gm of gems) {
        if (gm.state !== "wall") continue;
        gm.spark -= 1;
        if (gm.spark <= 0) {
          gm.spark = 60 + (Math.random() * 80 | 0);
          particles.push({
            x: gm.tx * T + 4 + (Math.random() * 8 | 0),
            y: gm.ty * T + 2,
            vx: 0, vy: -0.5,
            life: 20,
            color: "#ffffff",
            gold: false,
            size: 1,
          });
        }
      }
      requestAnimationFrame(loop);
    }

    layout();
    window.addEventListener("resize", layout);
    requestAnimationFrame(loop);
  </script>

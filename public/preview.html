<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iolit preview</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Fraunces;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/fraunces-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: #ffffff;
      color: hsl(30 22% 12%);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas#world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: hsl(30 10% 50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid hsl(38 22% 86%);
      border-radius: 999px;
      padding: 6px 12px;
      z-index: 3;
      white-space: nowrap;
    }
    .banner a { color: hsl(262 70% 45%); text-decoration: none; }
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px calc(96px + clamp(96px, 22vh, 150px) + 16px);
      pointer-events: none;
    }
    .copy {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 10px;
    }
    .accent {
      color: hsl(262 70% 38%);
      font-style: italic;
      padding-right: 0.3em;
    }
    .sub {
      font-size: 15px;
      line-height: 1.55;
      color: hsl(30 10% 36%);
      text-align: center;
      max-width: 340px;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
    }
    input[type="email"] {
      flex: 1;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid hsl(38 22% 82%);
      background: #ffffff;
      font-size: 14px;
      color: hsl(30 22% 12%);
      outline: none;
    }
    input[type="email"]:focus {
      border-color: hsl(262 70% 45%);
      box-shadow: 0 0 0 3px hsl(262 70% 45% / 0.15);
    }
    .btn {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #faf7f0;
      background: hsl(262 70% 45%);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .ok { display: none; font-size: 15px; font-weight: 500; }
    .ok.show { display: block; }
    .err { display: none; font-size: 12px; color: hsl(0 70% 45%); margin-top: 10px; }
    .err.show { display: block; }
    .term {
      margin-top: 20px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      background: hsl(30 22% 10%);
      color: hsl(38 30% 90%);
      padding: 13px 18px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      cursor: pointer;
      box-shadow: 0 10px 24px -12px rgba(30, 15, 5, 0.35);
    }
    .term .dollar { color: hsl(262 40% 70%); }
    .term .hint {
      margin-left: 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
    }
    .tiers {
      margin-top: 12px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: hsl(30 10% 44%);
    }
    .pad {
      display: none;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: none) {
      .pad { display: flex; }
    }
    .pad button {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 15px;
      width: 58px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid hsl(38 22% 82%);
      background: #ffffff;
      color: hsl(30 22% 20%);
      cursor: pointer;
      touch-action: manipulation;
    }
    .pad button:active { background: hsl(262 70% 45%); color: #faf7f0; }
    footer {
      margin-top: 18px;
      display: flex;
      gap: 18px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
    }
    footer a { color: hsl(30 10% 44%); text-decoration: none; }
    footer a:hover { color: hsl(262 70% 45%); }
  </style>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="banner">preview · <a href="/">live site</a></div>
  <main>
    <div class="copy">
      <h1>Your AI subscription<br>should <span class="accent">pay you back.</span></h1>
      <p class="sub">A silent agent for Claude, Cursor, and Codex. More you share, more you get paid.</p>
      <form id="form">
        <input type="email" required placeholder="you@example.com" id="email" />
        <button class="btn" type="submit">Join waitlist</button>
      </form>
      <div class="ok" id="ok">You're on the list. We'll email once.</div>
      <p class="err" id="err">Something went wrong. Try again.</p>
      <button class="term" id="copy" type="button">
        <span class="dollar">$</span>
        <span>curl -fsSL iolit.dev/install | sh</span>
        <span class="hint" id="copied">copy</span>
      </button>
      <p class="tiers">pulse · trace · raw</p>
      <div class="pad">
        <button id="b-l" aria-label="left">◀</button>
        <button id="b-j" aria-label="jump">▲</button>
        <button id="b-m" aria-label="mine">⛏</button>
        <button id="b-r" aria-label="right">▶</button>
      </div>
      <footer>
        <a href="/">live</a>
        <a href="/privacy">privacy</a>
        <a href="/terms">terms</a>
        <a href="https://github.com/Emad-log/iolit-client">source</a>
      </footer>
    </div>
  </main>
  <script>
    const INSTALL = "curl -fsSL iolit.dev/install | sh";
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(INSTALL); } catch {}
      const hint = document.getElementById("copied");
      hint.textContent = "copied";
      setTimeout(() => { hint.textContent = "copy"; }, 1600);
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.classList.remove("show");
      try {
        const res = await fetch("/api/waitlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value, source: "preview" }),
        });
        if (!res.ok) throw new Error("bad");
        document.getElementById("form").style.display = "none";
        document.getElementById("ok").classList.add("show");
      } catch {
        err.classList.add("show");
      }
    });

    const T = 8;
    const TIERS = {
      pulse: { color: "#c4b5fd", hi: "#ede9fe", coins: 1 },
      trace: { color: "#8b5cf6", hi: "#ddd6fe", coins: 4 },
      raw: { color: "#4c1d95", hi: "#a78bfa", coins: 12 },
    };
    const ROCK = "#e9e4d8", ROCK_HI = "#f6f2e9", ROCK_LO = "#d5cec0", ROCK_LINE = "#b9b0a0";

    const cv = document.getElementById("world");
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;

    let W = 0, H = 0, floorRow = 0;
    let solid = new Uint8Array(0);
    let gems = [];
    let particles = [];
    let floats = [];
    let dust = [];
    let coins = 0, gemsMined = 0;
    let frame = 0;
    let forgeX = 0;

    const miner = {
      x: 24, y: 0, vx: 0, vy: 0,
      w: 8, h: 12,
      facing: 1, grounded: false,
      mine: 0, walk: 0,
      carry: [],
    };
    const keys = {};
    let mineQueued = false;
    let lastInput = -1e9;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const now = () => performance.now();

    function tile(tx, ty) {
      if (tx < 0 || tx >= W || ty < 0 || ty >= H) return 1;
      return solid[ty * W + tx];
    }
    function setTile(tx, ty, v) {
      if (tx >= 0 && tx < W && ty >= 0 && ty < H) solid[ty * W + tx] = v;
    }

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      cv.width = Math.floor(w * dpr);
      cv.height = Math.floor(h * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = Math.ceil(w / T) + 1;
      H = Math.ceil(h / T) + 1;
      floorRow = H - Math.ceil(clamp(96, h * 0.22, 150) / T) - 1;
      solid = new Uint8Array(W * H);

      for (let ty = floorRow; ty < H; ty++) {
        for (let tx = 0; tx < W; tx++) setTile(tx, ty, 1);
      }
      const spots = [0.14, 0.3, 0.46, 0.62, 0.78];
      for (const s of spots) setTile(Math.floor(W * s), floorRow - 1, 1);
      forgeX = Math.floor(W * 0.9) * T;
      for (let tx = Math.floor(W * 0.9); tx < Math.floor(W * 0.9) + 3; tx++) {
        setTile(tx, floorRow - 2, 1);
        setTile(tx, floorRow - 1, 1);
      }

      gems = [];
      spawnGem(Math.floor(W * 0.14), floorRow - 1, "pulse");
      spawnGem(Math.floor(W * 0.3), floorRow - 1, "trace");
      spawnGem(Math.floor(W * 0.46), floorRow - 1, "raw");
      spawnGem(Math.floor(W * 0.62), floorRow - 1, "trace");
      spawnGem(Math.floor(W * 0.78), floorRow - 1, "pulse");

      miner.x = 24;
      miner.y = (floorRow - 1) * T - miner.h - 2;
      miner.vx = 0; miner.vy = 0; miner.carry = [];
      particles = [];
      floats = [];

      dust = [];
      for (let i = 0; i < 26; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * (floorRow * T - 20),
          vx: -0.08 - Math.random() * 0.1,
          vy: 0.04 + Math.random() * 0.06,
          s: Math.random() > 0.7 ? 2 : 1,
        });
      }
    }
    function clamp(a, v, b) { return Math.max(a, Math.min(b, v)); }

    function spawnGem(tx, ty, tier) {
      gems.push({ tx, ty, tier, state: "wall", crack: 0 });
    }

    function touchUser() { lastInput = now(); }

    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
      keys[e.key] = true;
      if (e.code === "Space") mineQueued = true;
      touchUser();
    });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    function hold(id, dir) {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        touchUser();
        if (dir === "l") keys["ArrowLeft"] = true;
        if (dir === "r") keys["ArrowRight"] = true;
        if (dir === "j") keys["ArrowUp"] = true;
        if (dir === "m") mineQueued = true;
      });
      el.addEventListener("pointerup", () => {
        if (dir === "l") keys["ArrowLeft"] = false;
        if (dir === "r") keys["ArrowRight"] = false;
        if (dir === "j") keys["ArrowUp"] = false;
      });
      el.addEventListener("pointerleave", () => {
        if (dir === "l") keys["ArrowLeft"] = false;
        if (dir === "r") keys["ArrowRight"] = false;
        if (dir === "j") keys["ArrowUp"] = false;
      });
    }
    hold("b-l", "l"); hold("b-r", "r"); hold("b-j", "j"); hold("b-m", "m");

    function inForge() {
      return miner.x + miner.w >= forgeX - T * 2 && miner.x <= forgeX + T * 5 && miner.grounded;
    }

    function gemAt(tx, ty) {
      return gems.find((gm) => gm.state === "wall" && gm.tx === tx && gm.ty === ty);
    }

    function gemInFront() {
      const tx = miner.facing === 1
        ? ((miner.x + miner.w) / T | 0)
        : ((miner.x - 1) / T | 0);
      const head = (miner.y / T) | 0;
      const chest = ((miner.y + 4) / T) | 0;
      const feet = ((miner.y + miner.h - 2) / T) | 0;
      for (const ty of [head, chest, feet]) {
        const gm = gemAt(tx, ty);
        if (gm) return gm;
      }
      return null;
    }

    function autopilot() {
      if (reduce) return;
      if (now() - lastInput < 4200) return;

      if (miner.carry.length >= 3 || (miner.carry.length > 0 && !gems.some((gm) => gm.state === "wall"))) {
        if (inForge()) {
          mineQueued = true;
          return;
        }
        keys["ArrowRight"] = true;
        keys["ArrowLeft"] = false;
        keys["ArrowUp"] = tile(((miner.x + miner.w) / T) | 0, ((miner.y + miner.h - 2) / T) | 0) ? true : false;
        return;
      }

      const live = gems.filter((gm) => gm.state === "wall");
      if (!live.length) return;
      let best = null, bd = 1e9;
      const mx = miner.x + 4, my = miner.y + 6;
      for (const gm of live) {
        const d = Math.abs(gm.tx * T + 4 - mx) + Math.abs(gm.ty * T + 4 - my);
        if (d < bd) { bd = d; best = gm; }
      }
      if (!best) return;

      if (gemInFront() && miner.grounded) {
        mineQueued = true;
        return;
      }

      const tx = best.tx * T + 4;
      miner.facing = tx >= mx ? 1 : -1;
      keys["ArrowLeft"] = tx < mx - 3;
      keys["ArrowRight"] = tx > mx + 3;
      const blockedAhead = tile(
        miner.facing === 1 ? ((miner.x + miner.w) / T | 0) : ((miner.x - 1) / T | 0),
        ((miner.y + miner.h - 2) / T) | 0,
      );
      keys["ArrowUp"] = miner.grounded && blockedAhead;
    }

    function update() {
      if (miner.mine > 0) {
        miner.mine -= 1;
        if (miner.mine === 6) hitRock();
        miner.vx = 0;
      } else {
        miner.vx = 0;
        if (keys["ArrowLeft"]) { miner.vx = -1.5; miner.facing = -1; }
        if (keys["ArrowRight"]) { miner.vx = 1.5; miner.facing = 1; }
        if (miner.vx !== 0 && miner.grounded) miner.walk = (miner.walk + 1) % 14;

        if (mineQueued && miner.grounded) {
          mineQueued = false;
          if (inForge() && miner.carry.length) {
            deposit();
          } else {
            const gem = gemInFront();
            if (gem && miner.carry.length < 3) {
              miner.mine = 14;
              miner.vx = 0;
            }
          }
        }
      }
      mineQueued = false;

      miner.vy = Math.min(5, miner.vy + 0.34);
      if (keys["ArrowUp"] && miner.grounded) { miner.vy = -4.9; miner.grounded = false; }

      miner.x += miner.vx;
      if (miner.vx < 0) {
        const t = (miner.x / T) | 0;
        if (tile(t, (miner.y / T) | 0) || tile(t, ((miner.y + miner.h - 1) / T) | 0)) miner.x = (t + 1) * T;
      } else if (miner.vx > 0) {
        const t = ((miner.x + miner.w) / T) | 0;
        if (tile(t, (miner.y / T) | 0) || tile(t, ((miner.y + miner.h - 1) / T) | 0)) miner.x = t * T - miner.w;
      }
      miner.x = Math.max(T, Math.min(window.innerWidth - miner.w - T, miner.x));

      miner.y += miner.vy;
      if (miner.vy < 0) {
        const t = (miner.y / T) | 0;
        if (tile((miner.x / T) | 0, t) || tile(((miner.x + miner.w - 1) / T) | 0, t)) {
          miner.y = (t + 1) * T;
          miner.vy = 0;
        }
      } else {
        const t = ((miner.y + miner.h) / T) | 0;
        if (tile((miner.x / T) | 0, t) || tile(((miner.x + miner.w - 1) / T) | 0, t)) {
          miner.y = t * T - miner.h;
          miner.vy = 0;
          miner.grounded = true;
        } else {
          miner.grounded = false;
        }
      }
    }

    function hitRock() {
      const gem = gemInFront();
      if (!gem || miner.carry.length >= 3) return;
      const px = gem.tx * T + 4, py = gem.ty * T + 4;
      if (gem.crack === 0) {
        gem.crack = 1;
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: px, y: py,
            vx: (Math.random() - 0.5) * 2.4,
            vy: -Math.random() * 2 - 0.4,
            life: 18 + (Math.random() * 10 | 0),
            color: i % 2 ? ROCK_HI : ROCK_LO,
            gold: false,
          });
        }
      } else {
        gem.state = "carried";
        miner.carry.push(gem.tier);
        gemsMined += 1;
        setTile(gem.tx, gem.ty, 0);
        for (let i = 0; i < 10; i++) {
          particles.push({
            x: px, y: py,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2.4 - 0.5,
            life: 24 + (Math.random() * 12 | 0),
            color: i % 2 ? TIERS[gem.tier].hi : TIERS[gem.tier].color,
            gold: false,
          });
        }
        setTimeout(() => {
          gem.state = "done";
          if (!gems.some((gm) => gm.state === "wall")) {
            const open = [
              [Math.floor(W * 0.14), floorRow - 1, "pulse"],
              [Math.floor(W * 0.3), floorRow - 1, "trace"],
              [Math.floor(W * 0.46), floorRow - 1, "raw"],
              [Math.floor(W * 0.62), floorRow - 1, "trace"],
              [Math.floor(W * 0.78), floorRow - 1, "pulse"],
            ];
            for (const [tx, ty, tier] of open) {
              if (!gems.some((gm) => gm.tx === tx && gm.ty === ty && gm.state !== "done")) {
                setTile(tx, ty, 1);
                spawnGem(tx, ty, tier);
                break;
              }
            }
          }
        }, 600);
      }
    }

    function deposit() {
      let total = 0;
      for (const tier of miner.carry) total += TIERS[tier].coins;
      coins += total;
      miner.carry = [];
      const px = forgeX + T * 2, py = (floorRow - 2) * T;
      for (let i = 0; i < 5 + total; i++) {
        particles.push({
          x: px + (Math.random() - 0.5) * 12, y: py,
          vx: (Math.random() - 0.5) * 2.4,
          vy: -2.6 - Math.random() * 2,
          life: 30 + (Math.random() * 14 | 0),
          color: "#f5c542",
          gold: true,
        });
      }
      floats.push({ x: px, y: py - 6, text: "+" + total, life: 44 });
    }

    function px(x, y, w, h, color) {
      g.fillStyle = color;
      g.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function drawMiner() {
      const m = miner;
      const bob = m.grounded && m.vx !== 0 ? (m.walk > 6 ? 1 : 0) : 0;
      const cx = m.x, cy = m.y - bob;
      g.save();
      g.translate(Math.round(cx + 4), Math.round(cy));
      if (m.facing === -1) g.scale(-1, 1);
      g.translate(-4, 0);

      const swing = m.mine > 0;
      const phase = swing ? Math.floor((14 - m.mine) / 4) : 0;

      if (swing) {
        if (phase === 0) {
          px(5, -1, 1, 4, "#b8873f");
          px(2, -3, 4, 1, "#b9bec9");
        } else if (phase === 1) {
          px(6, -4, 1, 5, "#b8873f");
          px(3, -5, 4, 1, "#b9bec9");
        } else {
          px(7, -1, 1, 4, "#b8873f");
          px(4, 1, 4, 1, "#e8ecf5");
          px(4, 1, 1, 1, "#ffffff");
        }
      } else {
        px(0, 4, 1, 4, "#7a5a2f");
      }

      px(1, 0, 6, 2, "#d9d2e2");
      px(0, 2, 8, 1, "#b3aac4");
      px(5, 1, 2, 2, "#ffd54a");
      px(7, 1, 1, 1, "#fff3c4");
      px(1, 3, 6, 2, "#e8b98a");
      px(5, 3, 1, 1, "#241a33");
      px(1, 5, 6, 4, "#5b3f9e");
      px(2, 5, 1, 4, "#3b2a63");
      px(1, 7, 6, 1, "#2b1f4a");
      const leg = m.grounded && m.vx !== 0 ? (m.walk > 6 ? 0 : 1) : 0;
      px(1, 9, 2, 2 + leg, "#4a2f85");
      px(4, 9, 2, 3 - leg, "#4a2f85");
      px(1, 11, 2, 1, "#241a33");
      px(4, 11, 2, 1, "#241a33");
      g.restore();

      for (let i = 0; i < m.carry.length; i++) {
        const tier = TIERS[m.carry[i]];
        const gy = m.y - 9 - i * 5;
        px(m.x + 1, gy, 3, 2, tier.color);
        px(m.x + 2, gy - 1, 1, 1, tier.hi);
      }
    }

    function drawGem(gm) {
      if (gm.state !== "wall") return;
      const tx = gm.tx * T, ty = gm.ty * T;
      const tier = TIERS[gm.tier];
      const tw = frame % 24 < 3;
      px(tx + 2, ty - 3, 4, 1, tier.color);
      px(tx + 1, ty - 2, 6, 2, tier.color);
      px(tx + 2, ty, 4, 1, tier.color);
      px(tx + 3, ty - 2, 1, 1, tw ? tier.hi : "#f5f0ff");
      if (gm.crack === 1) {
        px(tx + 1, ty - 2, 1, 1, "#8d8578");
        px(tx + 3, ty, 1, 1, "#8d8578");
        px(tx + 5, ty - 3, 1, 1, "#8d8578");
      }
    }

    function drawForge() {
      const fx = forgeX, fy = (floorRow - 2) * T;
      for (let i = 0; i < 3; i++) {
        px(fx + i * T, fy, T, T, ROCK);
        px(fx + i * T, fy, T, 1, ROCK_HI);
        px(fx + i * T, fy + T - 1, T, 1, ROCK_LO);
        px(fx + i * T, fy, 1, T, ROCK_LINE);
      }
      const fire = frame % 16 < 8;
      px(fx + T, fy - 4, 8, 4, "#6d28d9");
      px(fx + T + 2, fy - (fire ? 7 : 5), 4, fire ? 4 : 2, "#a78bfa");
      px(fx + T + 3, fy - 8, 2, 2, "#ede9fe");
      const chestX = fx + T * 4;
      px(chestX, fy + 2, T, T - 2, "#8a5a2b");
      px(chestX, fy + 2, T, 2, "#a5713f");
      px(chestX + 3, fy + 5, 2, 2, "#f5c542");
    }

    function drawMarker(x, y) {
      const bob = frame % 40 < 20 ? 0 : 2;
      g.fillStyle = "rgba(60, 50, 40, 0.55)";
      g.font = "6px ui-monospace, Menlo, monospace";
      g.textAlign = "center";
      g.fillText("▼", x, y - 10 + bob);
      g.textAlign = "left";
    }

    function drawWorld() {
      const w = window.innerWidth, h = window.innerHeight;
      g.clearRect(0, 0, w, h);

      for (const d of dust) {
        g.fillStyle = "rgba(90, 78, 62, 0.10)";
        g.fillRect(Math.round(d.x), Math.round(d.y), d.s, d.s);
      }

      for (let ty = 0; ty < H; ty++) {
        for (let tx = 0; tx < W; tx++) {
          if (!tile(tx, ty)) continue;
          const x = tx * T, y = ty * T;
          px(x, y, T, T, ROCK);
          px(x, y, T, 1, ROCK_HI);
          px(x, y + T - 1, T, 1, ROCK_LO);
          px(x, y, 1, T, ROCK_LINE);
        }
      }

      drawForge();
      for (const gm of gems) drawGem(gm);

      for (const p of particles) {
        g.globalAlpha = Math.max(0, p.life / 30);
        if (p.gold) {
          px(p.x - 1, p.y - 1, 3, 3, p.color);
          px(p.x - 1, p.y - 1, 3, 1, "#fff3c4");
        } else {
          px(p.x, p.y, 2, 2, p.color);
        }
        g.globalAlpha = 1;
      }

      drawMiner();

      const live = gems.filter((gm) => gm.state === "wall");
      if (miner.carry.length >= 3 || !live.length) {
        if (miner.carry.length) drawMarker(forgeX + T * 2, (floorRow - 2) * T);
      } else {
        let best = null, bd = 1e9;
        const mx = miner.x + 4, my = miner.y + 6;
        for (const gm of live) {
          const d = Math.abs(gm.tx * T + 4 - mx) + Math.abs(gm.ty * T + 4 - my);
          if (d < bd) { bd = d; best = gm; }
        }
        if (best) drawMarker(best.tx * T + 4, best.ty * T);
      }

      g.font = "7px ui-monospace, Menlo, monospace";
      g.textBaseline = "top";
      g.fillStyle = "rgba(60, 50, 40, 0.7)";
      g.fillText("gems " + gemsMined + " · coins " + coins, 10, 10);
      if (miner.carry.length) {
        g.fillStyle = "rgba(91, 63, 158, 0.8)";
        g.fillText("haul " + miner.carry.length + "/3", 10, 20);
      }

      for (const f of floats) {
        g.globalAlpha = Math.max(0, f.life / 44);
        g.fillStyle = "#e6a817";
        g.fillText(f.text, f.x, f.y);
        g.globalAlpha = 1;
      }
    }

    function loop() {
      autopilot();
      update();
      drawWorld();
      frame += 1;
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 1;
      }
      particles = particles.filter((p) => p.life > 0);
      for (const f of floats) { f.y -= 0.4; f.life -= 1; }
      floats = floats.filter((f) => f.life > 0);
      for (const d of dust) {
        d.x += d.vx;
        d.y += d.vy;
        if (d.x < -4) d.x = window.innerWidth + 4;
        if (d.y > floorRow * T - 8) d.y = 4;
      }
      requestAnimationFrame(loop);
    }

    layout();
    window.addEventListener("resize", layout);
    requestAnimationFrame(loop);
  </script>
</body>
</html>

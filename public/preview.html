<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iolit preview</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Fraunces;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/fraunces-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: #ffffff;
      color: hsl(30 22% 12%);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas#world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: hsl(30 10% 50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid hsl(38 22% 86%);
      border-radius: 999px;
      padding: 6px 12px;
      z-index: 3;
      white-space: nowrap;
    }
    .banner a { color: hsl(262 70% 45%); text-decoration: none; }
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px calc(96px + clamp(140px, 28vh, 240px) + 16px);
      pointer-events: none;
    }
    .copy {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 10px;
    }
    .accent {
      color: hsl(262 70% 38%);
      font-style: italic;
      padding-right: 0.3em;
    }
    .sub {
      font-size: 15px;
      line-height: 1.55;
      color: hsl(30 10% 36%);
      text-align: center;
      max-width: 340px;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
    }
    input[type="email"] {
      flex: 1;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid hsl(38 22% 82%);
      background: #ffffff;
      font-size: 14px;
      color: hsl(30 22% 12%);
      outline: none;
    }
    input[type="email"]:focus {
      border-color: hsl(262 70% 45%);
      box-shadow: 0 0 0 3px hsl(262 70% 45% / 0.15);
    }
    .btn {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #faf7f0;
      background: hsl(262 70% 45%);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .ok { display: none; font-size: 15px; font-weight: 500; }
    .ok.show { display: block; }
    .err { display: none; font-size: 12px; color: hsl(0 70% 45%); margin-top: 10px; }
    .err.show { display: block; }
    .term {
      margin-top: 20px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      background: hsl(30 22% 10%);
      color: hsl(38 30% 90%);
      padding: 13px 18px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      cursor: pointer;
      box-shadow: 0 10px 24px -12px rgba(30, 15, 5, 0.35);
    }
    .term .dollar { color: hsl(262 40% 70%); }
    .term .hint {
      margin-left: 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
    }
    .tiers {
      margin-top: 12px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: hsl(30 10% 44%);
    }
    .pad {
      display: none;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: none) {
      .pad { display: flex; }
    }
    .pad button {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 15px;
      width: 58px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid hsl(38 22% 82%);
      background: #ffffff;
      color: hsl(30 22% 20%);
      cursor: pointer;
      touch-action: manipulation;
    }
    .pad button:active { background: hsl(262 70% 45%); color: #faf7f0; }
    footer {
      margin-top: 18px;
      display: flex;
      gap: 18px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
    }
    footer a { color: hsl(30 10% 44%); text-decoration: none; }
    footer a:hover { color: hsl(262 70% 45%); }
  </style>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="banner">preview · <a href="/">live site</a></div>
  <main>
    <div class="copy">
      <h1>Your AI subscription<br>should <span class="accent">pay you back.</span></h1>
      <p class="sub">A silent agent for Claude, Cursor, and Codex. More you share, more you get paid.</p>
      <form id="form">
        <input type="email" required placeholder="you@example.com" id="email" />
        <button class="btn" type="submit">Join waitlist</button>
      </form>
      <div class="ok" id="ok">You're on the list. We'll email once.</div>
      <p class="err" id="err">Something went wrong. Try again.</p>
      <button class="term" id="copy" type="button">
        <span class="dollar">$</span>
        <span>curl -fsSL iolit.dev/install | sh</span>
        <span class="hint" id="copied">copy</span>
      </button>
      <p class="tiers">pulse · trace · raw</p>
      <div class="pad">
        <button id="b-l" aria-label="left">◀</button>
        <button id="b-j" aria-label="jump">▲</button>
        <button id="b-m" aria-label="mine">⛏</button>
        <button id="b-r" aria-label="right">▶</button>
      </div>
      <footer>
        <a href="/">live</a>
        <a href="/privacy">privacy</a>
        <a href="/terms">terms</a>
        <a href="https://github.com/Emad-log/iolit-client">source</a>
      </footer>
    </div>
  </main>
  <script>
    const INSTALL = "curl -fsSL iolit.dev/install | sh";
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(INSTALL); } catch {}
      const hint = document.getElementById("copied");
      hint.textContent = "copied";
      setTimeout(() => { hint.textContent = "copy"; }, 1600);
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.classList.remove("show");
      try {
        const res = await fetch("/api/waitlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value, source: "preview" }),
        });
        if (!res.ok) throw new Error("bad");
        document.getElementById("form").style.display = "none";
        document.getElementById("ok").classList.add("show");
      } catch {
        err.classList.add("show");
      }
    });

    const T = 12;
    const S = 2;
    const TIERS = {
      pulse: { color: "#c4b5fd", mid: "#a78bfa", dark: "#6d28d9", hi: "#ffffff", coins: 1 },
      trace: { color: "#a78bfa", mid: "#8b5cf6", dark: "#5b21b6", hi: "#ffffff", coins: 4 },
      raw: { color: "#7c3aed", mid: "#5b21b6", dark: "#3b0a63", hi: "#ffffff", coins: 12 },
    };
    const ROCK = "#e7e1d3", ROCK_HI = "#f7f3ea", ROCK_LO = "#cfc7b7", ROCK_LINE = "#b4aa97";

    const cv = document.getElementById("world");
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;

    let W = 0, H = 0, floorRow = 0;
    let solid = new Uint8Array(0);
    let gems = [];
    let particles = [];
    let floats = [];
    let dust = [];
    let smoke = [];
    let clouds = [];
    let coins = 0, gemsMined = 0;
    let frame = 0;
    let forgeX = 0;
    let shake = 0;
    let freeze = 0;
    let lastCoins = 0;

    const miner = {
      x: 24, y: 0, vx: 0, vy: 0,
      w: 14, h: 18,
      facing: 1, grounded: false,
      mine: 0, walk: 0,
      coyote: 0, jumpBuf: 0,
      carry: [],
    };
    const keys = {};
    let mineQueued = false;
    let lastInput = -1e9;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const now = () => performance.now();

    function tile(tx, ty) {
      if (tx < 0 || tx >= W || ty < 0 || ty >= H) return 1;
      return solid[ty * W + tx];
    }
    function setTile(tx, ty, v) {
      if (tx >= 0 && tx < W && ty >= 0 && ty < H) solid[ty * W + tx] = v;
    }

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth / S;
      const h = window.innerHeight / S;
      cv.width = Math.floor(window.innerWidth * dpr);
      cv.height = Math.floor(window.innerHeight * dpr);
      g.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
      W = Math.ceil(w / T) + 1;
      H = Math.ceil(h / T) + 1;
      floorRow = H - Math.ceil(clamp(70, h * 0.3, 120) / T) - 1;
      solid = new Uint8Array(W * H);

      for (let ty = floorRow; ty < H; ty++) {
        for (let tx = 0; tx < W; tx++) setTile(tx, ty, 1);
      }
      const stepAt = Math.floor(W * 0.36);
      for (let tx = stepAt; tx < stepAt + 4; tx++) setTile(tx, floorRow - 1, 1);
      for (let tx = stepAt + 4; tx < stepAt + 6; tx++) {
        setTile(tx, floorRow - 2, 1);
        setTile(tx, floorRow - 1, 1);
      }

      const tow1 = Math.floor(W * 0.52);
      for (let i = 0; i < 4; i++) {
        for (let r = 1; r <= i + 1; r++) setTile(tow1 + i, floorRow - r, 1);
      }
      for (let tx = tow1 + 4; tx < tow1 + 7; tx++) {
        for (let r = 1; r <= 4; r++) setTile(tx, floorRow - r, 1);
      }
      const tow2 = Math.floor(W * 0.68);
      for (let i = 0; i < 6; i++) {
        for (let r = 1; r <= i + 1; r++) setTile(tow2 + i, floorRow - r, 1);
      }
      for (let tx = tow2 + 6; tx < tow2 + 9; tx++) {
        for (let r = 1; r <= 6; r++) setTile(tx, floorRow - r, 1);
      }

      forgeX = Math.floor(W * 0.88) * T;
      for (let tx = Math.floor(W * 0.88); tx < Math.floor(W * 0.88) + 3; tx++) {
        setTile(tx, floorRow - 2, 1);
        setTile(tx, floorRow - 1, 1);
      }

      gems = [];
      spawnGem(Math.floor(W * 0.12), floorRow - 1, "pulse");
      spawnGem(Math.floor(W * 0.24), floorRow - 1, "trace");
      spawnGem(stepAt + 5, floorRow - 3, "trace");
      spawnGem(tow1 + 5, floorRow - 5, "raw");
      spawnGem(tow2 + 7, floorRow - 7, "raw");

      miner.x = 24;
      miner.y = (floorRow - 1) * T - miner.h - 2;
      miner.vx = 0; miner.vy = 0; miner.carry = [];
      miner.coyote = 0; miner.jumpBuf = 0;
      particles = [];
      floats = [];
      smoke = [];

      dust = [];
      for (let i = 0; i < 22; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * (floorRow * T - 24),
          vx: -0.06 - Math.random() * 0.1,
          vy: 0.03 + Math.random() * 0.05,
          s: Math.random() > 0.6 ? 2 : 1,
        });
      }

      clouds = [
        { x: w * 0.2, y: h * 0.16, s: 1.0, v: 0.05 },
        { x: w * 0.55, y: h * 0.1, s: 1.4, v: 0.07 },
        { x: w * 0.8, y: h * 0.2, s: 0.8, v: 0.04 },
      ];
    }
    function clamp(a, v, b) { return Math.max(a, Math.min(b, v)); }

    function spawnGem(tx, ty, tier) {
      gems.push({ tx, ty, tier, state: "wall", crack: 0, spark: 40 + (Math.random() * 60 | 0) });
    }

    function touchUser() { lastInput = now(); }

    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
      if (!keys[e.key]) {
        keys[e.key] = true;
        if (e.code === "Space" || e.key === "ArrowUp") {
          mineQueued = e.code === "Space";
          miner.jumpBuf = 7;
        }
      }
      touchUser();
    });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    function hold(id, dir) {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        touchUser();
        if (dir === "l") keys["ArrowLeft"] = true;
        if (dir === "r") keys["ArrowRight"] = true;
        if (dir === "j") { miner.jumpBuf = 7; keys["ArrowUp"] = true; }
        if (dir === "m") mineQueued = true;
      });
      el.addEventListener("pointerup", () => {
        if (dir === "l") keys["ArrowLeft"] = false;
        if (dir === "r") keys["ArrowRight"] = false;
        if (dir === "j") keys["ArrowUp"] = false;
      });
      el.addEventListener("pointerleave", () => {
        if (dir === "l") keys["ArrowLeft"] = false;
        if (dir === "r") keys["ArrowRight"] = false;
        if (dir === "j") keys["ArrowUp"] = false;
      });
    }
    hold("b-l", "l"); hold("b-r", "r"); hold("b-j", "j"); hold("b-m", "m");

    function inForge() {
      return miner.x + miner.w >= forgeX - T * 2 && miner.x <= forgeX + T * 5 && miner.grounded;
    }

    function gemAt(tx, ty) {
      return gems.find((gm) => gm.state === "wall" && gm.tx === tx && gm.ty === ty);
    }

    function gemInFront() {
      const tx = miner.facing === 1
        ? ((miner.x + miner.w) / T | 0)
        : ((miner.x - 1) / T | 0);
      const head = (miner.y / T) | 0;
      const chest = ((miner.y + 6) / T) | 0;
      const feet = ((miner.y + miner.h - 2) / T) | 0;
      for (const ty of [head, chest, feet]) {
        const gm = gemAt(tx, ty);
        if (gm) return gm;
      }
      return null;
    }

    function autopilot() {
      if (reduce) return;
      if (now() - lastInput < 4200) return;

      if (miner.carry.length >= 3 || (miner.carry.length > 0 && !gems.some((gm) => gm.state === "wall"))) {
        keys["ArrowLeft"] = false;
        keys["ArrowRight"] = true;
        keys["ArrowUp"] = tile(((miner.x + miner.w) / T | 0), ((miner.y + miner.h - 2) / T) | 0) ? true : false;
        return;
      }

      const live = gems.filter((gm) => gm.state === "wall");
      if (!live.length) return;
      let best = null, bd = 1e9;
      const mx = miner.x + 7, my = miner.y + 9;
      for (const gm of live) {
        const d = Math.abs(gm.tx * T + 6 - mx) + Math.abs(gm.ty * T + 6 - my);
        if (d < bd) { bd = d; best = gm; }
      }
      if (!best) return;

      if (gemInFront() && miner.grounded) {
        mineQueued = true;
        return;
      }

      const tx = best.tx * T + 6;
      miner.facing = tx >= mx ? 1 : -1;
      keys["ArrowLeft"] = tx < mx - 4;
      keys["ArrowRight"] = tx > mx + 4;
      const blockedAhead = tile(
        miner.facing === 1 ? ((miner.x + miner.w) / T | 0) : ((miner.x - 1) / T | 0),
        ((miner.y + miner.h - 2) / T) | 0,
      );
      keys["ArrowUp"] = miner.grounded && blockedAhead;
    }

    function update() {
      if (freeze > 0) {
        freeze -= 1;
        return;
      }
      if (miner.mine > 0) {
        miner.mine -= 1;
        if (miner.mine === 6) hitRock();
        miner.vx = 0;
      } else {
        miner.vx = 0;
        if (keys["ArrowLeft"]) { miner.vx = -2; miner.facing = -1; }
        if (keys["ArrowRight"]) { miner.vx = 2; miner.facing = 1; }
        if (miner.vx !== 0 && miner.grounded) {
          miner.walk = (miner.walk + 1) % 16;
          if (frame % 9 === 0) {
            particles.push({
              x: miner.x + 7, y: miner.y + miner.h - 2,
              vx: -miner.vx * 0.15 + (Math.random() - 0.5) * 0.3,
              vy: -0.3 - Math.random() * 0.4,
              life: 14 + (Math.random() * 8 | 0),
              color: "#d8d0c0",
              gold: false,
              size: 2,
            });
          }
        }

        if (miner.grounded && miner.carry.length && inForge()) {
          deposit();
        } else if (mineQueued && miner.grounded) {
          mineQueued = false;
          const gem = gemInFront();
          if (gem && miner.carry.length < 3) {
            miner.mine = 16;
            miner.vx = 0;
          }
        }
      }
      mineQueued = false;

      miner.vy = Math.min(6.5, miner.vy + 0.42);
      const wantJump = keys["ArrowUp"] || miner.jumpBuf > 0;
      if (miner.jumpBuf > 0) miner.jumpBuf -= 1;
      if (wantJump && (miner.grounded || miner.coyote > 0)) {
        miner.vy = -6.6;
        miner.grounded = false;
        miner.coyote = 0;
        miner.jumpBuf = 0;
      }
      if (miner.grounded) miner.coyote = 7;
      else if (miner.coyote > 0) miner.coyote -= 1;

      miner.x += miner.vx;
      if (miner.vx < 0) {
        const t = (miner.x / T) | 0;
        if (tile(t, (miner.y / T) | 0) || tile(t, ((miner.y + miner.h - 1) / T) | 0)) miner.x = (t + 1) * T;
      } else if (miner.vx > 0) {
        const t = ((miner.x + miner.w) / T) | 0;
        if (tile(t, (miner.y / T) | 0) || tile(t, ((miner.y + miner.h - 1) / T) | 0)) miner.x = t * T - miner.w;
      }
      miner.x = Math.max(T, Math.min(window.innerWidth / S - miner.w - T, miner.x));

      miner.y += miner.vy;
      if (miner.vy < 0) {
        const t = (miner.y / T) | 0;
        if (tile((miner.x / T) | 0, t) || tile(((miner.x + miner.w - 1) / T) | 0, t)) {
          miner.y = (t + 1) * T;
          miner.vy = 0;
        }
      } else {
        const t = ((miner.y + miner.h) / T) | 0;
        if (tile((miner.x / T) | 0, t) || tile(((miner.x + miner.w - 1) / T) | 0, t)) {
          miner.y = t * T - miner.h;
          miner.vy = 0;
          miner.grounded = true;
        } else {
          miner.grounded = false;
        }
      }
    }

    function hitRock() {
      const gem = gemInFront();
      if (!gem || miner.carry.length >= 3) return;
      const px = gem.tx * T + 6, py = gem.ty * T + 6;
      shake = 5;
      freeze = 2;
      if (gem.crack === 0) {
        gem.crack = 1;
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: px, y: py - 3,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 2.6 - 0.5,
            life: 22 + (Math.random() * 12 | 0),
            color: i % 2 ? ROCK_HI : ROCK_LO,
            gold: false,
            size: Math.random() > 0.5 ? 3 : 2,
          });
        }
      } else {
        gem.state = "carried";
        miner.carry.push(gem.tier);
        gemsMined += 1;
        setTile(gem.tx, gem.ty, 0);
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: px, y: py - 3,
            vx: (Math.random() - 0.5) * 2.8,
            vy: -Math.random() * 3 - 0.8,
            life: 28 + (Math.random() * 16 | 0),
            color: i % 2 ? TIERS[gem.tier].hi : TIERS[gem.tier].mid,
            gold: false,
            size: 3,
          });
        }
        floats.push({ x: px, y: py - 10, text: TIERS[gem.tier].coins + " gem", life: 40, color: "#8b5cf6" });
        setTimeout(() => {
          gem.state = "done";
          if (!gems.some((gm) => gm.state === "wall")) {
            const stepAt = Math.floor(W * 0.36);
            const open = [
              [Math.floor(W * 0.12), floorRow - 1, "pulse"],
              [Math.floor(W * 0.24), floorRow - 1, "trace"],
              [Math.floor(W * 0.36) + 5, floorRow - 3, "trace"],
              [Math.floor(W * 0.52) + 5, floorRow - 5, "raw"],
              [Math.floor(W * 0.68) + 7, floorRow - 7, "raw"],
            ];
            for (const [tx, ty, tier] of open) {
              if (!gems.some((gm) => gm.tx === tx && gm.ty === ty && gm.state !== "done")) {
                if (ty === floorRow - 1) setTile(tx, ty, 1);
                spawnGem(tx, ty, tier);
                break;
              }
            }
          }
        }, 600);
      }
    }

    function deposit() {
      let total = 0;
      for (const tier of miner.carry) total += TIERS[tier].coins;
      coins += total;
      miner.carry = [];
      const px = forgeX + T * 2, py = (floorRow - 2) * T;
      for (let i = 0; i < 6 + total; i++) {
        particles.push({
          x: px + (Math.random() - 0.5) * 16, y: py,
          vx: (Math.random() - 0.5) * 2.8,
          vy: -3 - Math.random() * 2.4,
          life: 32 + (Math.random() * 16 | 0),
          color: "#f5c542",
          gold: true,
          size: 4,
        });
      }
      floats.push({ x: px, y: py - 8, text: "+" + total, life: 46, color: "#e6a817" });
    }

    function px(x, y, w, h, color) {
      g.fillStyle = color;
      g.fillRect(Math.round(x), Math.round(y), w, h);
    }

    const PAL = {
      h: "#d9d2e2", H: "#b3aac4",
      y: "#ffd54a", Y: "#fff3c4",
      f: "#e8b98a", e: "#241a33",
      j: "#5b3f9e", J: "#4a2f85",
      B: "#2b1f4a", p: "#4a2f85",
      k: "#241a33", w: "#8a5a2b", m: "#cfd2dd",
    };

    const BODY = [
      ".....hhhhhh.....",
      "....hhhhhhhh....",
      "...hhhhyyyhhh...",
      "..hhhhhhhyyhh...",
      "hhhhhhhhhhhhhhh",
      ".....fffff......",
      "....fffffff.....",
      "....fffefef.....",
      "....fffffff.....",
      ".....fffff......",
      ".....jjjjjj.....",
      "....jjjjjjjj....",
      "....jJjjjjJj....",
      "....jjjjjjjj....",
      "....jBBBBBBj....",
      "....jjjjjjjj....",
      ".....pppppp.....",
      ".....pp..pp.....",
      ".....pp..pp.....",
      ".....kk..kk.....",
    ];
    const BODY_WALK1 = [
      ".....hhhhhh.....",
      "....hhhhhhhh....",
      "...hhhhyyyhhh...",
      "..hhhhhhhyyhh...",
      "hhhhhhhhhhhhhhh",
      ".....fffff......",
      "....fffffff.....",
      "....fffefef.....",
      "....fffffff.....",
      ".....fffff......",
      ".....jjjjjj.....",
      "....jjjjjjjj....",
      "....jJjjjjJj....",
      "....jjjjjjjj....",
      "....jBBBBBBj....",
      "....jjjjjjjj....",
      ".....pppppp.....",
      "....pp..pp......",
      "...pp....pp.....",
      "...kk....kk.....",
    ];
    const BODY_WALK2 = [
      ".....hhhhhh.....",
      "....hhhhhhhh....",
      "...hhhhyyyhhh...",
      "..hhhhhhhyyhh...",
      "hhhhhhhhhhhhhhh",
      ".....fffff......",
      "....fffffff.....",
      "....fffefef.....",
      "....fffffff.....",
      ".....fffff......",
      ".....jjjjjj.....",
      "....jjjjjjjj....",
      "....jJjjjjJj....",
      "....jjjjjjjj....",
      "....jBBBBBBj....",
      "....jjjjjjjj....",
      ".....pppppp.....",
      ".....pp..pp.....",
      "....pp....pp....",
      "....kk....kk.....",
    ];

    function drawBody(rows, x, y) {
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < row.length; c++) {
          const ch = row[c];
          if (ch === "." || ch === " ") continue;
          if (PAL[ch]) px(x + c, y + r, 1, 1, PAL[ch]);
        }
      }
    }

    function drawPick(phase, x, y) {
      const w = PAL.w, m = PAL.m;
      if (phase === 0) {
        px(x + 10, y + 2, 2, 10, w);
        px(x + 6, y, 5, 2, m);
        px(x + 10, y - 1, 2, 2, m);
      } else if (phase === 1) {
        px(x + 12, y - 8, 2, 12, w);
        px(x + 9, y - 10, 5, 2, m);
      } else {
        px(x + 9, y + 7, 11, 2, w);
        px(x + 18, y + 3, 2, 7, m);
        px(x + 18, y + 2, 3, 2, "#ffffff");
      }
    }

    function drawMiner() {
      const m = miner;
      const moving = m.grounded && m.vx !== 0;
      const idleBob = !moving && m.mine === 0 ? Math.round(Math.sin(frame * 0.06) * 1) : 0;
      const bob = moving ? (m.walk > 7 ? 1 : 0) : idleBob;
      const cx = m.x, cy = m.y - bob;
      let rows = BODY;
      if (moving) rows = m.walk > 7 ? BODY_WALK2 : BODY_WALK1;

      const lamX = m.x + (m.facing === 1 ? 11 : 2);
      const beam = g.createRadialGradient(lamX, m.y + 3, 1, lamX, m.y + 3, 26);
      beam.addColorStop(0, "rgba(255, 210, 100, 0.22)");
      beam.addColorStop(1, "rgba(255, 210, 100, 0)");
      g.fillStyle = beam;
      g.fillRect(lamX - 26, m.y - 23, 52, 52);

      g.save();
      g.translate(Math.round(cx), Math.round(cy));
      if (m.facing === -1) g.scale(-1, 1);
      g.translate(-1, 0);

      const swing = m.mine > 0;
      const phase = swing ? Math.floor((16 - m.mine) / 5) : -1;
      if (swing) drawPick(phase, 0, 0);
      else {
        px(0, 9, 1, 6, PAL.w);
      }
      drawBody(rows, 0, 0);
      g.restore();

      for (let i = 0; i < m.carry.length; i++) {
        const tier = TIERS[m.carry[i]];
        const gy = m.y - 12 - i * 7;
        px(m.x + 4, gy, 6, 2, tier.color);
        px(m.x + 2, gy + 2, 10, 3, tier.mid);
        px(m.x + 5, gy + 5, 4, 2, tier.dark);
        px(m.x + 6, gy + 1, 2, 1, tier.hi);
      }
    }

    function drawBoulder(tx, ty) {
      const x = tx * T, y = ty * T;
      px(x + 1, y, T - 2, T, ROCK);
      px(x + 1, y, T - 2, 3, ROCK_HI);
      px(x + 2, y + T - 4, T - 4, 3, ROCK_LO);
      px(x + 1, y, 1, T, ROCK_LINE);
      px(x + T - 2, y, 1, T, ROCK_LINE);
      px(x + 1, y + T - 1, T - 2, 1, ROCK_LINE);
      px(x + 4, y + 5, 2, 2, ROCK_LO);
      px(x + 9, y + 8, 2, 2, ROCK_LO);
      px(x + 11, y + 3, 1, 1, ROCK_LO);
    }

    function drawSlab(tx0, tx1, ty) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const x = tx * T, y = ty * T;
        px(x + 1, y, T - 2, T, ROCK);
        px(x + 1, y, T - 2, 2, ROCK_HI);
        px(x + 1, y + T - 2, T - 2, 2, ROCK_LO);
        px(x + 1, y + T - 1, T - 2, 1, ROCK_LINE);
        if (tx === tx0) px(x + 1, y, 1, T, ROCK_LINE);
        if (tx === tx1) px(x + T - 2, y, 1, T, ROCK_LINE);
      }
      g.fillStyle = "rgba(90, 80, 62, 0.08)";
      g.fillRect(tx0 * T + 4, (ty + 1) * T, (tx1 - tx0 + 1) * T - 8, 3);
    }

    function drawGem(gm) {
      if (gm.state !== "wall") return;
      const renderTy = gm.ty >= floorRow - 2 ? gm.ty : gm.ty + 1;
      const tx = gm.tx * T, ty = renderTy * T;
      const tier = TIERS[gm.tier];
      const tw = frame % 28 < 4;
      px(tx + 3, ty - 5, 10, 2, tier.color);
      px(tx + 1, ty - 3, 14, 3, tier.color);
      px(tx + 3, ty, 10, 2, tier.mid);
      px(tx + 2, ty - 2, 3, 2, tier.hi);
      px(tx + 9, ty - 1, 2, 1, tier.dark);
      px(tx + 6, ty - 4, 2, 2, tw ? "#ffffff" : tier.hi);
      if (gm.crack === 1) {
        px(tx + 2, ty + 4, 1, 2, "#7d756a");
        px(tx + 6, ty + 6, 2, 1, "#7d756a");
        px(tx + 11, ty + 4, 1, 2, "#7d756a");
      }
    }

    function drawForge() {
      const fx = forgeX, fy = (floorRow - 2) * T;
      for (let i = 0; i < 3; i++) {
        const x = fx + i * T;
        px(x + 1, fy, T - 2, T, ROCK);
        px(x + 1, fy, T - 2, 3, ROCK_HI);
        px(x + 2, fy + T - 4, T - 4, 3, ROCK_LO);
        px(x + 1, fy, 1, T, ROCK_LINE);
        px(x + T - 2, fy, 1, T, ROCK_LINE);
        px(x + 1, fy + T - 1, T - 2, 1, ROCK_LINE);
        px(x + 3, fy + 5, 2, 2, ROCK_LO);
        px(x + 10, fy + 9, 2, 2, ROCK_LO);
      }
      const glow = g.createRadialGradient(fx + T + 6, fy - 4, 1, fx + T + 6, fy - 4, 16);
      glow.addColorStop(0, "rgba(167, 139, 250, 0.4)");
      glow.addColorStop(1, "rgba(167, 139, 250, 0)");
      g.fillStyle = glow;
      g.fillRect(fx + T - 10, fy - 20, 32, 32);
      const fire = Math.floor(frame / 6) % 3;
      px(fx + T, fy - 6, 12, 6, "#6d28d9");
      px(fx + T + 3, fy - 6 - fire * 2, 6, 3 + fire * 2, "#a78bfa");
      px(fx + T + 5, fy - 8 - fire * 2, 3, 3, "#ede9fe");
      const chestX = fx + T * 4;
      px(chestX, fy + 5, T, T - 5, "#8a5a2b");
      px(chestX, fy + 5, T, 3, "#a5713f");
      px(chestX + 6, fy + 9, 4, 3, "#f5c542");
      px(chestX + 2, fy + 5, 2, 1, "#6d4520");
      px(chestX + 12, fy + 5, 2, 1, "#6d4520");
      const pile = Math.min(6, Math.floor(coins / 10));
      for (let i = 0; i < pile; i++) {
        px(chestX + 2 + (i % 3) * 4, fy + 2 - Math.floor(i / 3) * 3, 3, 2, "#f5c542");
      }
    }

    function drawMarker(x, y) {
      const bob = frame % 40 < 20 ? 0 : 3;
      g.fillStyle = "rgba(60, 50, 40, 0.55)";
      g.font = "8px ui-monospace, Menlo, monospace";
      g.textAlign = "center";
      g.fillText("▼", x, y - 18 + bob);
      g.textAlign = "left";
    }

    function drawSky(w, h) {
      const sky = g.createLinearGradient(0, 0, 0, h * 0.7);
      sky.addColorStop(0, "#f6f2fb");
      sky.addColorStop(1, "#ffffff");
      g.fillStyle = sky;
      g.fillRect(0, 0, w, h);

      for (const c of clouds) {
        g.fillStyle = "rgba(214, 200, 240, 0.5)";
        g.beginPath();
        g.ellipse(c.x, c.y, 34 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.ellipse(c.x - 22 * c.s, c.y + 4 * c.s, 22 * c.s, 8 * c.s, 0, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.ellipse(c.x + 24 * c.s, c.y + 5 * c.s, 20 * c.s, 7 * c.s, 0, 0, Math.PI * 2);
        g.fill();
      }

      g.fillStyle = "rgba(216, 202, 242, 0.55)";
      g.beginPath();
      g.ellipse(w * 0.15, floorRow * T + 18, w * 0.4, 26, 0, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "rgba(226, 214, 246, 0.6)";
      g.beginPath();
      g.ellipse(w * 0.7, floorRow * T + 22, w * 0.35, 20, 0, 0, Math.PI * 2);
      g.fill();
    }

    function drawWorld() {
      const w = window.innerWidth / S, h = window.innerHeight / S;
      g.save();
      if (shake > 0) {
        g.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
        shake -= 1;
      }
      g.clearRect(-4, -4, w + 8, h + 8);
      drawSky(w, h);

      for (const d of dust) {
        g.fillStyle = "rgba(90, 78, 62, 0.10)";
        g.fillRect(Math.round(d.x), Math.round(d.y), d.s, d.s);
      }
      for (const s of smoke) {
        g.fillStyle = "rgba(120, 110, 100, " + Math.max(0, 0.22 - s.age * 0.012) + ")";
        g.fillRect(Math.round(s.x), Math.round(s.y), 3, 3);
      }

      for (let ty = floorRow - 1; ty < H; ty++) {
        for (let tx = 0; tx < W; tx++) {
          if (!tile(tx, ty)) continue;
          const x = tx * T, y = ty * T;
          const isBoulder = ty === floorRow - 1 && gems.some((gm) => gm.state !== "done" && gm.tx === tx && gm.ty === ty);
          if (isBoulder) {
            drawBoulder(tx, ty);
          } else {
            px(x, y, T, T, ROCK);
            px(x, y, T, 2, ROCK_HI);
            px(x, y + T - 2, T, 2, ROCK_LO);
            px(x, y + T - 1, T, 1, ROCK_LINE);
            if ((tx * 7 + ty * 13) % 5 === 0) px(x + 6, y + 7, 2, 2, ROCK_LO);
            if ((tx * 3 + ty * 5) % 7 === 0) px(x + 3, y + 4, 1, 1, ROCK_HI);
          }
        }
      }

      drawForge();
      for (const gm of gems) drawGem(gm);

      for (const p of particles) {
        g.globalAlpha = Math.max(0, p.life / 34);
        if (p.gold) {
          px(p.x - 2, p.y - 2, 4, 4, p.color);
          px(p.x - 2, p.y - 2, 4, 1, "#fff3c4");
        } else {
          px(p.x, p.y, p.size, p.size, p.color);
        }
        g.globalAlpha = 1;
      }

      drawMiner();

      const live = gems.filter((gm) => gm.state === "wall");
      if (miner.carry.length >= 3 || !live.length) {
        if (miner.carry.length) drawMarker(forgeX + T * 2, (floorRow - 2) * T);
      } else {
        let best = null, bd = 1e9;
        const mx = miner.x + 7, my = miner.y + 9;
        for (const gm of live) {
          const d = Math.abs(gm.tx * T + 6 - mx) + Math.abs(gm.ty * T + 6 - my);
          if (d < bd) { bd = d; best = gm; }
        }
        if (best) drawMarker(best.tx * T + 6, best.ty * T);
      }

      for (const f of floats) {
        g.globalAlpha = Math.max(0, f.life / 46);
        g.fillStyle = f.color;
        g.font = "9px ui-monospace, Menlo, monospace";
        g.fillText(f.text, f.x, f.y);
        g.globalAlpha = 1;
      }
      g.restore();

      g.font = "9px ui-monospace, Menlo, monospace";
      g.textBaseline = "top";
      g.fillStyle = "rgba(60, 50, 40, 0.7)";
      g.fillText("gems " + gemsMined + " · coins " + coins, 12, 12);
      if (miner.carry.length) {
        g.fillStyle = "rgba(91, 63, 158, 0.8)";
        g.fillText("haul " + miner.carry.length + "/3", 12, 24);
      }
    }

    function loop() {
      autopilot();
      update();
      drawWorld();
      frame += 1;
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= 1;
      }
      particles = particles.filter((p) => p.life > 0);
      for (const f of floats) { f.y -= 0.4; f.life -= 1; }
      floats = floats.filter((f) => f.life > 0);
      for (const d of dust) {
        d.x += d.vx;
        d.y += d.vy;
        if (d.x < -4) d.x = window.innerWidth / S + 4;
        if (d.y > floorRow * T - 12) d.y = 4;
      }
      for (const s of smoke) {
        s.y -= 0.35;
        s.age += 1;
      }
      smoke = smoke.filter((s) => s.age < 26);
      if (frame % 14 === 0) {
        smoke.push({ x: forgeX + T + 5, y: (floorRow - 2) * T - 10, age: 0 });
      }
      for (const c of clouds) {
        c.x += c.v;
        if (c.x > window.innerWidth / S + 60) c.x = -60;
      }
      for (const gm of gems) {
        if (gm.state !== "wall") continue;
        gm.spark -= 1;
        if (gm.spark <= 0) {
          gm.spark = 60 + (Math.random() * 80 | 0);
          particles.push({
            x: gm.tx * T + 4 + (Math.random() * 8 | 0),
            y: gm.ty * T - 4 - (Math.random() * 6 | 0),
            vx: 0, vy: -0.5,
            life: 20,
            color: "#ffffff",
            gold: false,
            size: 1,
          });
        }
      }
      requestAnimationFrame(loop);
    }

    layout();
    window.addEventListener("resize", layout);
    requestAnimationFrame(loop);
  </script>
</body>
</html>

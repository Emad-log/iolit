<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iolit preview</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Fraunces;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/fraunces-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: hsl(38 40% 95%);
      color: hsl(30 22% 12%);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: hsl(30 10% 50%);
      background: hsl(38 45% 97% / 0.82);
      border: 1px solid hsl(38 22% 86%);
      border-radius: 999px;
      padding: 6px 12px;
      z-index: 2;
    }
    .banner a { color: hsl(262 70% 45%); text-decoration: none; }
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px 36px;
    }
    .copy {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 8px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.06;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 12px;
    }
    .accent {
      color: hsl(262 70% 38%);
      font-style: italic;
      padding-right: 0.3em;
    }
    .sub {
      font-size: 15px;
      line-height: 1.55;
      color: hsl(30 10% 32%);
      text-align: center;
      max-width: 340px;
      margin-bottom: 22px;
    }
    form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
    }
    input[type="email"] {
      flex: 1;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid hsl(38 22% 78%);
      background: hsl(38 45% 97% / 0.9);
      font-size: 14px;
      color: hsl(30 22% 12%);
      outline: none;
    }
    input[type="email"]:focus {
      border-color: hsl(262 70% 45%);
      box-shadow: 0 0 0 3px hsl(262 70% 45% / 0.15);
    }
    .btn {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #faf7f0;
      background: hsl(262 70% 45%);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .ok { display: none; font-size: 15px; font-weight: 500; }
    .ok.show { display: block; }
    .err { display: none; font-size: 12px; color: hsl(0 70% 45%); margin-top: 10px; }
    .err.show { display: block; }
    .term {
      margin-top: 28px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      background: hsl(30 22% 10% / 0.92);
      color: hsl(38 30% 90%);
      padding: 14px 18px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      cursor: pointer;
    }
    .term .dollar { color: hsl(262 40% 70%); }
    .term .hint {
      margin-left: 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.4;
    }
    .tiers {
      margin-top: 14px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: hsl(30 10% 40%);
    }
    footer {
      margin-top: 36px;
      display: flex;
      gap: 18px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
    }
    footer a { color: hsl(30 10% 42%); text-decoration: none; }
    footer a:hover { color: hsl(262 70% 45%); }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="banner">preview · <a href="/">live site</a></div>
  <main>
    <div class="copy">
      <h1>Your AI subscription<br>should <span class="accent">pay you back.</span></h1>
      <p class="sub">A silent agent for Claude, Cursor, and Codex. More you share, more you get paid.</p>
      <form id="form">
        <input type="email" required placeholder="you@example.com" id="email" />
        <button class="btn" type="submit">Join waitlist</button>
      </form>
      <div class="ok" id="ok">You're on the list. We'll email once.</div>
      <p class="err" id="err">Something went wrong. Try again.</p>
      <button class="term" id="copy" type="button">
        <span class="dollar">$</span>
        <span>curl -fsSL iolit.dev/install | sh</span>
        <span class="hint" id="copied">copy</span>
      </button>
      <p class="tiers">pulse · trace · raw</p>
      <footer>
        <a href="/">live</a>
        <a href="/privacy">privacy</a>
        <a href="/terms">terms</a>
        <a href="https://github.com/Emad-log/iolit-client">source</a>
      </footer>
    </div>
  </main>
  <script>
    const INSTALL = "curl -fsSL iolit.dev/install | sh";
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(INSTALL); } catch {}
      const hint = document.getElementById("copied");
      hint.textContent = "copied";
      setTimeout(() => { hint.textContent = "copy"; }, 1600);
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.classList.remove("show");
      try {
        const res = await fetch("/api/waitlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value, source: "preview" }),
        });
        if (!res.ok) throw new Error("bad");
        document.getElementById("form").style.display = "none";
        document.getElementById("ok").classList.add("show");
      } catch {
        err.classList.add("show");
      }
    });

    // The page is bits. Depth is only color + which digit.
    const REST = {
      n: [0, 1.12, 0],
      e: [0.96, 0.18, 0],
      s: [0, -1.28, 0],
      w: [-0.96, 0.18, 0],
      f: [0, 0.08, 0.62],
      b: [0, 0.08, -0.56],
      tn: [0, 0.72, 0.12],
      te: [0.28, 0.42, 0.18],
      tw: [-0.28, 0.42, 0.18],
      tb: [0, 0.42, -0.16],
      cu: [0, -0.08, 0],
    };
    const FACETS = [
      ["tn", "te", "f"],
      ["tn", "f", "tw"],
      ["te", "e", "f"],
      ["tw", "f", "w"],
      ["tn", "n", "te"],
      ["tn", "tw", "n"],
      ["n", "e", "te"],
      ["n", "tw", "w"],
      ["e", "s", "f"],
      ["w", "f", "s"],
      ["tn", "tb", "n"],
      ["n", "tb", "e"],
      ["n", "w", "tb"],
      ["e", "tb", "s"],
      ["w", "s", "tb"],
      ["e", "b", "s"],
      ["w", "s", "b"],
      ["n", "b", "e"],
      ["n", "w", "b"],
    ];

    function v3(a, b, c) { return [a, b, c]; }
    function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) {
      return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    }
    function len(a) { return Math.hypot(a[0], a[1], a[2]); }
    function norm(a) {
      const l = len(a) || 1;
      return [a[0] / l, a[1] / l, a[2] / l];
    }
    function rotX(p, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c];
    }
    function rotY(p, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c];
    }
    function hash(i, j, s) {
      let n = (i * 374761393 + j * 668265263 + s * 1440662637) >>> 0;
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    function bary(p, a, b, c) {
      const v0x = b[0] - a[0], v0y = b[1] - a[1];
      const v1x = c[0] - a[0], v1y = c[1] - a[1];
      const v2x = p[0] - a[0], v2y = p[1] - a[1];
      const den = v0x * v1y - v1x * v0y;
      if (Math.abs(den) < 1e-6) return null;
      const v = (v2x * v1y - v1x * v2y) / den;
      const w = (v0x * v2y - v2x * v0y) / den;
      const u = 1 - v - w;
      if (u < -0.004 || v < -0.004 || w < -0.004) return null;
      return true;
    }

    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha: false });
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let cell = 6;
    let cols = 0;
    let rows = 0;
    let bits = [];

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell = w < 640 ? 5.5 : 6.2;
      cols = Math.ceil(w / cell) + 1;
      rows = Math.ceil(h / cell) + 1;
      bits = new Array(cols * rows);
      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) bits[j * cols + i] = hash(i, j, 7) > 0.5 ? "1" : "0";
      }
    }

    function project(p, w, h, scale) {
      const z = p[2] + 3.05;
      const f = scale / z;
      return [w * 0.5 + p[0] * f, h * 0.36 - p[1] * f, p[2], z];
    }

    function mesh(t) {
      const yaw = reduce ? -0.48 : -0.38 + Math.sin(t / 6200) * 0.55;
      const pitch = 0.32 + (reduce ? 0 : Math.sin(t / 9100) * 0.06);
      const pts = {};
      for (const k of Object.keys(REST)) pts[k] = rotY(rotX(REST[k], pitch), yaw);
      const light = norm([
        -0.62 + (reduce ? 0 : Math.sin(t / 4300) * 0.2),
        0.74,
        0.28 + (reduce ? 0 : Math.cos(t / 4300) * 0.22),
      ]);
      const faces = [];
      for (const keys of FACETS) {
        const a = pts[keys[0]], b = pts[keys[1]], c = pts[keys[2]];
        const n = norm(cross(sub(b, a), sub(c, a)));
        if (n[2] <= 0.02) continue;
        const lambert = Math.max(0, dot(n, light));
        const spec = Math.pow(Math.max(0, 0.45 * lambert + 0.55 * n[2]), 16);
        faces.push({
          a, b, c, n,
          lit: 0.12 + lambert * 0.82 + spec * 0.7,
          spec,
          hue: 262 + (1 - lambert) * 8 - spec * 10,
          z: (a[2] + b[2] + c[2]) / 3,
        });
      }
      faces.sort((x, y) => x.z - y.z);
      return faces;
    }

    function draw(t) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.fillStyle = "hsl(38, 40%, 95%)";
      ctx.fillRect(0, 0, w, h);

      const scale = Math.min(w, h) * 1.05;
      const faces = mesh(t).map((f) => ({
        ...f,
        pa: project(f.a, w, h, scale),
        pb: project(f.b, w, h, scale),
        pc: project(f.c, w, h, scale),
      }));

      ctx.font = "600 " + Math.max(6, Math.round(cell * 0.92)) + "px ui-monospace, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const copyTop = h * 0.58;
      const tick = reduce ? 0 : ((t / 480) | 0);

      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          const px = (i + 0.5) * cell;
          const py = (j + 0.5) * cell;
          let hit = null;
          for (let k = faces.length - 1; k >= 0; k--) {
            if (bary([px, py], faces[k].pa, faces[k].pb, faces[k].pc)) {
              hit = faces[k];
              break;
            }
          }

          let bit = bits[j * cols + i];
          if (!reduce && hash(i, j, tick) > 0.992) bit = bit === "1" ? "0" : "1";

          if (hit) {
            const lit = Math.min(1.2, hit.lit);
            const ones = 0.76 - Math.min(1, lit) * 0.48;
            bit = hash(i, j, 3) > ones ? "1" : "0";
            if (hit.spec > 0.5) bit = "1";
            const sat = 64 + lit * 16;
            const lite = 16 + lit * 54;
            const quiet = py > copyTop ? 0.8 : 1;
            const alpha = (0.42 + Math.min(1, lit) * 0.52) * quiet;
            ctx.fillStyle = "hsla(" + hit.hue.toFixed(0) + ", " + sat.toFixed(0) + "%, " + lite.toFixed(0) + "%, " + alpha.toFixed(3) + ")";
          } else {
            const fade = py > copyTop ? 0.055 : 0.1;
            ctx.fillStyle = "hsla(30, 10%, 26%, " + fade + ")";
          }
          ctx.fillText(bit, px, py);
        }
      }
    }

    layout();
    if (reduce) draw(0);
    else {
      const tick = (now) => {
        draw(now);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    window.addEventListener("resize", () => {
      layout();
      if (reduce) draw(0);
    });
  </script>
</body>
</html>

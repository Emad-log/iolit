<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iolit preview</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Fraunces;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/fraunces-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: hsl(38 40% 95%);
      color: hsl(30 22% 12%);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: hsl(30 10% 50%);
      background: hsl(38 45% 97%);
      border: 1px solid hsl(38 22% 86%);
      border-radius: 999px;
      padding: 6px 12px;
      z-index: 2;
    }
    .banner a { color: hsl(262 70% 45%); text-decoration: none; }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 88px 24px 56px;
    }
    .gem {
      width: 44px;
      height: 44px;
      margin-bottom: 28px;
      filter: drop-shadow(0 2px 2px rgba(40, 20, 10, 0.18));
    }
    .gem svg { width: 100%; height: 100%; display: block; }
    .facet {
      mix-blend-mode: screen;
      animation: catch 7s ease-in-out infinite;
    }
    @keyframes catch {
      0%, 100% { opacity: 0.15; }
      45% { opacity: 0.85; }
      60% { opacity: 0.2; }
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(34px, 5.6vw, 52px);
      line-height: 1.06;
      letter-spacing: -0.025em;
      text-align: center;
      margin-bottom: 14px;
    }
    .accent {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 60%, #5b21b6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-style: italic;
      padding-right: 0.3em;
    }
    .sub {
      font-size: 16px;
      line-height: 1.55;
      color: hsl(30 10% 42%);
      text-align: center;
      max-width: 360px;
      margin-bottom: 28px;
    }
    form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
    }
    input[type="email"] {
      flex: 1;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid hsl(38 22% 86%);
      background: hsl(38 45% 97%);
      font-size: 14px;
      color: hsl(30 22% 12%);
      outline: none;
    }
    input[type="email"]:focus {
      border-color: hsl(262 70% 45%);
      box-shadow: 0 0 0 3px hsl(262 70% 45% / 0.15);
    }
    .btn {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #faf7f0;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .ok {
      display: none;
      font-size: 15px;
      font-weight: 500;
    }
    .ok.show { display: block; }
    .err { display: none; font-size: 12px; color: hsl(0 70% 45%); margin-top: 10px; }
    .err.show { display: block; }
    .term {
      margin-top: 40px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      background: hsl(30 22% 8%);
      color: hsl(38 30% 90%);
      padding: 14px 18px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      cursor: pointer;
      min-width: 320px;
    }
    .term .dollar { color: hsl(262 40% 65%); }
    .term .cmd { min-width: 15ch; }
    .term .cursor {
      display: inline-block;
      width: 7px;
      height: 13px;
      background: hsl(262 40% 70%);
      margin-left: 1px;
      vertical-align: -1px;
      animation: blink 1s steps(1) infinite;
    }
    .term.done .cursor { display: none; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term .hint {
      margin-left: auto;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.4;
    }
    .tiers {
      margin-top: 16px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: hsl(30 10% 50%);
    }
    footer {
      margin-top: 64px;
      display: flex;
      gap: 18px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
    }
    footer a { color: hsl(30 10% 50%); text-decoration: none; }
    footer a:hover { color: hsl(262 70% 45%); }
  </style>
</head>
<body>
  <div class="banner">preview · <a href="/">live site</a></div>
  <main>
    <div class="gem" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
            <stop stop-color="#a78bfa" />
            <stop offset="1" stop-color="#6d28d9" />
          </linearGradient>
        </defs>
        <path d="M12 3 L19 9 L12 21 L5 9 Z" fill="url(#g)" />
        <path d="M12 3 L12 12 L5 9 Z" fill="rgba(255,255,255,0.25)" />
        <path d="M12 3 L12 12 L19 9 Z" fill="rgba(255,255,255,0.1)" />
        <path d="M12 12 L5 9 L12 21 Z" fill="rgba(0,0,0,0.08)" />
        <path d="M12 12 L19 9 L12 21 Z" fill="rgba(0,0,0,0.03)" />
        <path class="facet" d="M8.2 7.6 L12 4.4 L11.2 9.2 Z" fill="rgba(255,255,255,0.9)" />
      </svg>
    </div>

    <h1>Your AI subscription<br>should <span class="accent">pay you back.</span></h1>
    <p class="sub">A silent agent for Claude, Cursor, and Codex. More you share, more you get paid.</p>

    <form id="form">
      <input type="email" required placeholder="you@example.com" id="email" />
      <button class="btn" type="submit">Join waitlist</button>
    </form>
    <div class="ok" id="ok">You're on the list. We'll email once.</div>
    <p class="err" id="err">Something went wrong. Try again.</p>

    <button class="term" id="copy" type="button">
      <span class="dollar">$</span>
      <span class="cmd" id="cmd"></span>
      <span class="cursor" id="caret"></span>
      <span class="hint" id="copied">copy</span>
    </button>
    <p class="tiers">pulse · trace · raw</p>

    <footer>
      <a href="/">live</a>
      <a href="/privacy">privacy</a>
      <a href="/terms">terms</a>
      <a href="https://github.com/Emad-log/iolit-client">source</a>
    </footer>
  </main>
  <script>
    const text = "curl -fsSL iolit.dev/install | sh";
    const cmd = document.getElementById("cmd");
    const term = document.getElementById("copy");
    let n = 0;
    function type() {
      if (n <= text.length) {
        cmd.textContent = text.slice(0, n);
        n += 1;
        setTimeout(type, n < 4 ? 180 : 28);
      } else {
        term.classList.add("done");
      }
    }
    setTimeout(type, 420);

    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch {}
      const hint = document.getElementById("copied");
      hint.textContent = "copied";
      setTimeout(() => { hint.textContent = "copy"; }, 1600);
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const err = document.getElementById("err");
      err.classList.remove("show");
      try {
        const res = await fetch("/api/waitlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, source: "preview" }),
        });
        if (!res.ok) throw new Error("bad");
        document.getElementById("form").style.display = "none";
        document.getElementById("ok").classList.add("show");
      } catch {
        err.classList.add("show");
      }
    });
  </script>
</body>
</html>
